<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Racconti">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Racconti di ispirazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Unbounded";src:url(fonts/unbounded.woff2) format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
/* Nero pieno, un solo carattere (San Francisco sui dispositivi Apple), fotografie grandi,
   niente bordi. Lo schermo non si muove mai: scorre solo il contenuto della home. */
:root{
  color-scheme:dark;
  --bg:#000;
  --surface:#1c1c1e;
  --label:#f5f5f7;
  --secondary:#98989f;
  --separator:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;width:100%}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{display:block;-webkit-user-drag:none;pointer-events:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
body{height:100%;width:100%}
.app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:500px;margin:0 auto;overflow:hidden;background:var(--bg)}
#probe{position:absolute;visibility:hidden;pointer-events:none;top:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),transform .5s var(--ease),visibility 0s .5s}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .4s var(--ease),transform .5s var(--ease)}
.press{transition:transform .25s var(--ease)}
.press:active{transform:scale(.97)}

/* ---------- Home: porte che scorrono di lato e si coprono. Una porta è una foto, la successiva è solo una parola.
   Tipografia: una sola famiglia larga. Le parole grandi tutte maiuscole e sottili; tutto il resto minuscolo, piccolo, spaziato. ---------- */
#home{overflow:hidden}
.doors{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x}
.doors::-webkit-scrollbar{display:none;width:0;height:0}
.door{position:sticky;left:0;flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000;color:var(--label);box-shadow:-50px 0 90px rgba(0,0,0,.6)}
.door .bg{position:absolute;top:0;bottom:0;left:-10%;width:120%;height:100%;object-fit:cover;will-change:transform}
.door.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 58%,rgba(0,0,0,.82) 100%)}
.door .in{position:absolute;z-index:1;left:26px;right:26px;bottom:calc(40px + var(--sb));display:flex;flex-direction:column;align-items:flex-start;gap:14px;will-change:transform,opacity}
.tiny{font-family:"Unbounded",var(--font);font-weight:300;font-size:11px;letter-spacing:.14em;text-transform:lowercase;color:rgba(255,255,255,.62)}
.word{font-family:"Unbounded",var(--font);font-weight:300;font-size:44px;line-height:1.04;letter-spacing:.01em;text-transform:uppercase;margin:0;white-space:nowrap}
.door{isolation:isolate}
.door.type .bg{opacity:.13}
.amb{position:absolute;inset:-25%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(36% 28% at 30% 36%,rgba(255,200,130,.17),transparent 72%),radial-gradient(32% 26% at 72% 66%,rgba(150,175,255,.08),transparent 72%);animation:amb 44s ease-in-out infinite alternate;will-change:transform}
.door.photo .amb{opacity:.6}
@keyframes amb{0%{transform:translate3d(-7%,-4%,0) rotate(0deg)}50%{transform:translate3d(6%,4%,0) rotate(9deg)}100%{transform:translate3d(-3%,7%,0) rotate(-7deg)}}
/* laboratorio: la parola riempie la pagina, due lettere per riga. Le lettere sono finestre: dentro si vedono due fotografie che si scambiano piano */
.knock .under{position:absolute;inset:0;background:#4a433c;overflow:hidden}
.knock .under .bg{mix-blend-mode:screen;filter:brightness(1.7) contrast(1.05)}
.knock .under .b2{animation:dx 26s ease-in-out infinite alternate}
@keyframes dx{from{opacity:0}to{opacity:.85}}
.knock .mask{position:absolute;inset:0;background:#0a0a0a;mix-blend-mode:multiply;display:flex;align-items:center}
.rows{width:100%;padding:0 22px;font-family:"Unbounded",var(--font);font-weight:700;text-transform:uppercase;line-height:.88;color:#fff;font-size:150px}
.rows div{display:flex;justify-content:space-between;white-space:nowrap}
.knock .enter{top:calc(12px + var(--st));bottom:auto;right:16px;border:0;color:rgba(255,255,255,.62)}
.knock .n{position:absolute;z-index:1;top:calc(24px + var(--st));left:26px}
@media (prefers-reduced-motion:reduce){.amb,.knock .under .b2{animation:none}}
.door.type .in{bottom:auto;top:43%}
.di{font-size:.27em;letter-spacing:.16em;text-transform:lowercase;color:rgba(255,255,255,.62);margin-left:.5em}
.ch{display:inline-block}
.vword{position:absolute;z-index:1;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) rotate(-90deg);font-family:"Unbounded",var(--font);font-weight:300;font-size:96px;line-height:1;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;will-change:transform}
.type .n{position:absolute;z-index:1;top:calc(24px + var(--st));left:26px}
.type .s{position:absolute;z-index:1;bottom:calc(34px + var(--sb));left:26px}
.enter{position:absolute;z-index:1;right:24px;bottom:calc(26px + var(--sb));width:48px;height:48px;border:1px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center}
.enter svg{width:16px;height:16px}
.end .in{bottom:auto;top:50%;transform:translateY(-50%);gap:18px}
.end .word{font-size:20px;color:var(--secondary)}
.upd{margin-top:14px;height:40px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--label);font-family:"Unbounded",var(--font);font-weight:300;font-size:11px;letter-spacing:.1em;text-transform:lowercase}
.upd.new{background:#fff;color:#000}

/* ---------- Laboratorio ---------- */
#lab{background:#000;touch-action:none;transform:translateY(24px);z-index:5}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bartop{position:absolute;top:0;left:0;right:0;padding:calc(12px + var(--st)) 14px 0;display:grid;grid-template-columns:44px 44px 1fr 44px 44px;align-items:center;gap:8px;pointer-events:none}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.round svg{width:18px;height:18px}
.piece{text-align:center;line-height:1.2}
.piece b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.piece span{font-size:13px;color:var(--secondary)}
.barbot{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(30px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
#status{min-height:24px;font-size:17px;font-weight:500;letter-spacing:-.01em;color:var(--label);text-align:center;opacity:0;transition:opacity .5s}
#reset{pointer-events:auto;width:100%;height:52px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:17px;font-weight:600;transition:opacity .3s,transform .25s var(--ease)}
#reset[disabled]{opacity:.32}
#intro.off{display:none}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:26px;padding:0 24px calc(28px + var(--sb));
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.9) 55%,#000 100%);transition:opacity .7s var(--ease),visibility 0s .7s}
#intro.off{opacity:0;visibility:hidden;pointer-events:none}
#intro h2{font-size:40px;line-height:1.03;letter-spacing:-.03em;margin:0;text-wrap:balance}
#intro ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:19px;line-height:1.25;color:var(--secondary);font-weight:500;letter-spacing:-.01em}
#intro li b{color:var(--label);font-weight:600}
#go{height:56px;border-radius:999px;background:#fff;color:#000;font-size:18px;font-weight:600;width:100%}
#go[disabled]{opacity:.6}
#intro small{font-size:13px;color:var(--secondary);text-align:center;margin-top:-10px}

.prog{position:absolute;left:16px;right:16px;top:calc(66px + var(--st));height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;background:rgba(255,255,255,.6);transform-origin:left;transform:scaleX(0)}
#lab.inmenu .piece{display:none}
#lab.inmenu .bartop .round{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:rgba(255,255,255,.55)}
#menu{position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:0;padding:calc(54px + var(--st)) 6px calc(14px + var(--sb));background:#000;transition:opacity .5s var(--ease),visibility 0s .5s}
#menu.off{opacity:0;visibility:hidden;pointer-events:none}
.glyph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--label);padding:0}
.glyph svg{width:54px;height:54px}
.glyph span{font-family:"Unbounded",var(--font);font-weight:300;font-size:9px;letter-spacing:.14em;text-transform:lowercase;color:var(--secondary)}
.bartop{z-index:4;transition:opacity .5s}
.ctl{transition:opacity .5s}
#lab.inmenu .ctl{opacity:0;pointer-events:none}
#lab:not(.inmenu):not(.ctlon) .bartop,#lab:not(.inmenu):not(.ctlon) .prog,#lab:not(.ctlon) .barbot{opacity:0;pointer-events:none}
#lab:not(.inmenu):not(.ctlon) .bartop *,#lab:not(.ctlon) .barbot *{pointer-events:none}
.barbot{transition:opacity .5s}
#zone{position:absolute;z-index:3;top:0;left:0;right:0;height:calc(64px + var(--st))}
#lab.inmenu #zone{display:none}
#zone::after{content:"";position:absolute;left:50%;bottom:26px;width:26px;height:2px;margin-left:-13px;border-radius:2px;background:rgba(255,255,255,.22);transition:opacity .5s}
#lab.ctlon #zone::after{opacity:0}
.piece b{font-family:"Unbounded",var(--font);font-weight:300;font-size:12px;letter-spacing:.1em;text-transform:lowercase}
.piece span{display:none}
.walk{font-family:"Unbounded",var(--font);font-weight:300;font-size:11px;letter-spacing:.1em;text-transform:lowercase}
.modes{position:absolute;left:0;right:0;top:calc(78px + var(--st));display:flex;gap:6px;padding:0 14px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;height:38px;padding:0 15px;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--secondary);transition:background .25s,color .25s}
.modes button.on{background:var(--glass);color:var(--label)}
#hint{margin:0;font-family:"Unbounded",var(--font);font-weight:300;font-size:15px;line-height:1.45;letter-spacing:.01em;text-transform:lowercase;color:var(--label);text-align:center;max-width:26ch;min-height:44px;text-wrap:balance;opacity:0;transition:opacity 1.6s}
#hint.show{opacity:.92}
.dots{display:flex;gap:7px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);transition:background .4s}
.dots i.on{background:#fff}
.walk{pointer-events:auto;height:40px;padding:0 18px;border-radius:999px;background:var(--glass);font-size:15px;font-weight:600;color:var(--label)}
.walk.on{background:#fff;color:#000}
.walkrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.introp{margin:0;font-size:19px;line-height:1.3;color:var(--secondary);font-weight:500;letter-spacing:-.01em;max-width:30ch}
@media (prefers-reduced-motion:reduce){.view,.press,#intro,#status,#reset{transition:none}}
</style>
</head>
<body>
<div class="app">
<div id="probe"></div>

<section class="view on" id="home">
  <div class="doors" id="doors">
    <header class="door photo">
      <img class="bg" src="img/p-cover.jpg" alt="Paolo Buonvino al pianoforte, solo sul palco, in un fascio di luce" style="object-position:50% 38%">
      <div class="amb"></div>
      <div class="in"><span class="tiny">paolo buonvino</span><h1 class="word">Racconti<span class="di">di</span><br>ispirazione</h1></div>
    </header>
    <a class="door knock" href="#laboratorio" id="tolab" aria-label="Laboratorio: entra">
      <div class="under"><img class="bg" src="img/p-musiche.jpg" alt="" style="object-position:50% 30%"><img class="bg b2" src="img/p-cover.jpg" alt="" style="object-position:50% 38%"><div class="amb"></div></div>
      <div class="mask"><div class="rows" id="rows" aria-hidden="true"><div>LA</div><div>BO</div><div>RA</div><div>TO</div><div>RIO</div></div></div>
      <span class="tiny n">01</span>
      <span class="enter" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
    <section class="door photo">
      <img class="bg" src="img/p-musiche.jpg" alt="" style="object-position:50% 30%">
      <div class="amb"></div>
      <div class="in"><span class="tiny">02</span><h2 class="word">Musiche</h2><span class="tiny">presto</span></div>
    </section>
    <section class="door type">
      <img class="bg" src="img/p-respiro.jpg" alt="" style="object-position:40% 50%">
      <div class="amb"></div>
      <div class="in"><span class="tiny">03</span><h2 class="word">Respiro</h2><span class="tiny">presto</span></div>
    </section>
    <section class="door photo">
      <img class="bg" src="img/p-taccuino.jpg" alt="" style="object-position:50% 40%">
      <div class="amb"></div>
      <div class="in"><span class="tiny">04</span><h2 class="word">Taccuino</h2><span class="tiny">presto</span></div>
    </section>
    <section class="door type">
      <img class="bg" src="img/p-letture.jpg" alt="" style="object-position:30% 50%">
      <div class="amb"></div>
      <div class="in"><span class="tiny">05</span><h2 class="word">Letture</h2><span class="tiny">presto</span></div>
    </section>
    <section class="door type end">
      <div class="in">
        <span class="tiny">e ancora, presto</span>
        <p class="word">La musica<br>che nasce insieme</p>
        <p class="word">Partiture</p>
        <p class="word">Giardini</p>
        <p class="word">Le vostre voci</p>
        <button id="upd" class="upd press" type="button">versione <span id="ver"></span> · aggiorna</button>
      </div>
    </section>
  </div>
</section>

<section class="view" id="lab" aria-label="Laboratorio">
  <canvas id="stage" aria-label="Superficie da toccare: la musica risponde ai gesti."></canvas>
  <div class="bartop">
    <button class="round press" id="back" type="button" aria-label="Indietro"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4L6 9l5 5"/></svg></button>
    <span></span>
    <div class="piece"><b>L’incanto sospeso</b><span>Paolo Buonvino</span></div>
    <button class="round press ctl" id="again" type="button" aria-label="Ricomincia dall’inizio"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9a5.5 5.5 0 1 0 1.8-4.1"/><path d="M3.2 2.6v3h3"/></svg></button>
    <button class="round press ctl" id="pause" type="button" aria-label="Pausa"><svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path id="pauseicon" d="M4.5 3h3v12h-3zM10.5 3h3v12h-3z"/></svg></button>
  </div>
  <div id="zone"></div>
  <div class="prog ctl" aria-hidden="true"><i id="prog"></i></div>
  <div class="barbot">
    <div class="walkrow"><button id="walk" class="walk press" type="button" hidden>cammina</button><button id="cal" class="walk press" type="button" hidden>tara</button></div>
    <p id="hint"></p>
  </div>
  <div id="menu">
    <button type="button" class="glyph press" data-m="stanza"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="9"/><circle cx="24" cy="46" r="3.2" fill="currentColor" stroke="none"/></svg><span>palco</span></button>
    <button type="button" class="glyph press" data-m="centri"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="32" cy="32" r="21"/><circle cx="32" cy="11" r="3.4" fill="currentColor" stroke="none"/><circle cx="13.8" cy="42.5" r="3.4" fill="currentColor" stroke="none"/><circle cx="50.2" cy="42.5" r="3.4" fill="currentColor" stroke="none"/></svg><span>centri · cerchio</span></button>
    <button type="button" class="glyph press" data-m="centri2"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M32 11L13.8 42.5h36.4z"/><path d="M32 22.5l10 17.2H22z" opacity=".55"/><path d="M32 29.5l4.6 8H27.4z" opacity=".3"/></svg><span>centri · triangolo</span></button>
    <button type="button" class="glyph press" data-m="centri3"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="32" cy="24" r="13"/><circle cx="23" cy="39" r="13"/><circle cx="41" cy="39" r="13"/></svg><span>centri · anelli</span></button>
    <button type="button" class="glyph press" data-m="se"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M20 44L46 18"/><circle cx="18" cy="46" r="7" fill="currentColor" stroke="none"/><circle cx="48" cy="16" r="7" fill="#000"/></svg><span>ricordarsi di sé</span></button>
    <button type="button" class="glyph press" data-m="risonanza"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M12 10v44M22 10v44M52 10v44M42 10v44"/><path d="M32 10c7 14 7 30 0 44"/></svg><span>risonanza</span></button>
    <button type="button" class="glyph press" data-m="esagramma"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M14 9h36M14 18h14M36 18h14M14 27h36M14 36h14M36 36h14M14 45h36M14 54h36"/></svg><span>esagramma</span></button>
    <button type="button" class="glyph press" data-m="perle"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M16 10v44M32 10v44M48 10v44"/><circle cx="16" cy="40" r="5" fill="#000"/><circle cx="32" cy="20" r="5" fill="currentColor"/><circle cx="48" cy="32" r="5" fill="#000"/></svg><span>perle</span></button>
    <button type="button" class="glyph press" data-m="go"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M12 22h40M12 32h40M12 42h40M22 12v40M32 12v40M42 12v40" opacity=".5"/><circle cx="32" cy="32" r="5" fill="currentColor" stroke="none"/><circle cx="42" cy="22" r="5" fill="#000"/></svg><span>go</span></button>
    <button type="button" class="glyph press" data-m="giardino"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="26" cy="36" r="3" fill="currentColor" stroke="none"/><circle cx="26" cy="36" r="9"/><circle cx="26" cy="36" r="15" opacity=".6"/><path d="M10 14h44M10 20h44" opacity=".4"/><path d="M48 30v24M54 30v24" opacity=".4"/></svg><span>giardino</span></button>
    <button type="button" class="glyph press" data-m="enso"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><path d="M44 14.5A21 21 0 1 0 52.5 27" stroke-width="3.2"/></svg><span>ensō</span></button>
  </div>
</section>

</div>
<script>
(function(){
"use strict";
/* ---- Lo schermo non si muove: niente zoom, niente rimbalzi ---- */

/* ---- Le parole grandi si adattano allo schermo: quelle in orizzontale alla larghezza, quelle in verticale all'altezza ---- */
function splitLetters(node){
  [].slice.call(node.childNodes).forEach(function(n){
    if(n.nodeType===3){ var f=document.createDocumentFragment(); n.textContent.split('').forEach(function(c){ if(c===' '){ f.appendChild(document.createTextNode(' ')); return; } var s=document.createElement('span'); s.className='ch'; s.textContent=c; f.appendChild(s); }); node.replaceChild(f,n); }
    else if(n.nodeType===1&&n.tagName!=='BR') splitLetters(n);
  });
}
[].forEach.call(document.querySelectorAll('.door:not(.end) .word'),function(w){ splitLetters(w); [].forEach.call(w.querySelectorAll('.ch'),function(c,i){ c.style.transitionDelay=(120+i*45)+'ms'; }); });
function fitOne(w,start){ var max=w.parentNode.clientWidth, fs=start, n=0; w.style.fontSize=fs+'px'; while(w.scrollWidth>max&&fs>12&&n<80){ fs-=1; w.style.fontSize=fs+'px'; n++; } return fs; }
function fitWords(){
  var words=[].slice.call(document.querySelectorAll('.door:not(.end) .word')), min=64;
  words.forEach(function(w){ min=Math.min(min,fitOne(w,64)); });     // una sola misura per tutte le porte: quella della parola più lunga
  words.forEach(function(w){ w.style.fontSize=min+'px'; });
  [].forEach.call(document.querySelectorAll('.end .word'),function(w){ fitOne(w,20); });
}

[].forEach.call(rowsEl.querySelectorAll('.ch'),function(c,i){ c.style.transitionDelay=(150+i*80)+'ms'; });
function fitRows(){

  rowsEl.style.fontSize=fs+'px';
  while(n<120&&[].some.call(rowsEl.children,function(r){ return r.scrollWidth>r.clientWidth+1; })){ fs-=2; rowsEl.style.fontSize=fs+'px'; n++; }
}

var doorsEl=document.getElementById('doors'), doorList=[].slice.call(doorsEl.children), doorRaf=0;
function layDoors(){
  doorRaf=0; var w=doorsEl.clientWidth||1, sl=doorsEl.scrollLeft;
  doorList.forEach(function(d,i){
    var off=(i*w-sl)/w; if(off<-1.2||off>1.2) return;
    var bg=d.querySelector('.bg'), inn=d.querySelector('.in'), vw=d.querySelector('.vword');
    if(bg) bg.style.transform='translate3d('+(-off*9)+'%,0,0) scale('+(1+0.06*Math.abs(off))+')';
    d.classList.toggle('live',Math.abs(off)<0.45);
  });
}
doorsEl.addEventListener('scroll',function(){ if(!doorRaf) doorRaf=requestAnimationFrame(layDoors); },{passive:true});

  if(!vHome.classList.contains('on')) return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ var w=doorsEl.clientWidth; doorsEl.scrollTo({left:(Math.round(doorsEl.scrollLeft/w)+(e.key==='ArrowRight'?1:-1))*w,behavior:'smooth'}); }

/* ---- Il brano: dieci strati del tema, 18 battute in loop ---- */
var INTRO=8*240/79.5, LOOP=18*240/79.5, XF=0.06;   // 8 battute di intro, poi 18 di tema in loop
var S=[
  {id:'piano', ref:.024},{id:'basso', ref:.102},{id:'mel1', ref:.028},{id:'mel2', ref:.027},{id:'arm1', ref:.023},
  {id:'arm2', ref:.027},{id:'short1',ref:.017},{id:'short2',ref:.018},{id:'short3',ref:.044},{id:'short4',ref:.014}
];
var ORDER10=['arm1','piano','mel1','mel2','short1','basso','arm2','short2','short3','short4'];
var LOADORDER=['short1','arm1','short2','piano','mel1','mel2','basso','arm2','short3','short4'];
var BY={}; S.forEach(function(s,i){s.i=i; s.want=0; s.gv=0; s.level=0; s.pan=0; BY[s.id]=s;});
var TOT=INTRO+LOOP, BEAT=LOOP/72, ENV_DT=0.05;


function makeDecoder(){
  var OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  try{ return new OC(2,1,32000); }catch(e){ return new OC(2,1,44100); }
}
var firstRes, firstReady=new Promise(function(r){ firstRes=r; });
function loadAll(){
  var dec=makeDecoder(), chain=Promise.resolve();
  LOADORDER.forEach(function(id){
    var s=BY[id];
    chain=chain.then(function(){ return fetch('stems/'+s.id+'.mp4'); })
    .then(function(r){ if(!r.ok) throw new Error('file'); return r.arrayBuffer(); })
    .then(function(ab){ return new Promise(function(res,rej){ dec.decodeAudioData(ab,res,rej); }); })
    .then(function(b){
      var sr=b.sampleRate, n=Math.min(Math.round((INTRO+LOOP)*sr),b.length), is=Math.round(INTRO*sr), xf=Math.round(XF*sr);
      var out=dec.createBuffer(b.numberOfChannels,n,sr);
      for(var c=0;c<b.numberOfChannels;c++){
        var src=b.getChannelData(c), d=out.getChannelData(c);
        d.set(src.subarray(0,n));
        for(var j=0;j<xf;j++){var a=j/xf*Math.PI/2; d[n-xf+j]=d[n-xf+j]*Math.cos(a)+src[is-xf+j]*Math.sin(a);}   // la fine del tema scivola nel suo inizio
      }
      var d0=out.getChannelData(0), w=Math.round(ENV_DT*sr), m=Math.floor(n/w), env=new Float32Array(m);
      for(var k=0;k<m;k++){var sum=0,o=k*w; for(var q=0;q<w;q+=4){sum+=d0[o+q]*d0[o+q];} env[k]=Math.sqrt(sum/(w/4));}
      s.buf=out; s.env=env; TOT=n/sr;
      if(id==='arm1') firstRes();
      if(started) attach(s);      // gli strati che arrivano dopo si agganciano a tempo
    });
  });
  return chain;
}
var prepared=null;
function prepare(){ if(!prepared) prepared=loadAll(); return prepared; }

/* ---- Motore: tutti gli strati partono insieme, cambia solo quanto si sentono ---- */
var ctx=null, master, revNode, t0=0, wantPlay=false, started=false, playing=false;
function impulse(){
  var sr=ctx.sampleRate,len=Math.floor(sr*2.6),b=ctx.createBuffer(2,len,sr);
  for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);
    for(var i=0;i<len;i++){var u=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-u,3)*(i<sr*0.012?i/(sr*0.012):1);}
  }
  return b;
}
function buildGraph(){
  master=ctx.createGain(); master.gain.value=0;
  var comp=ctx.createDynamicsCompressor(); comp.threshold.value=-8; comp.knee.value=6; comp.ratio.value=10; comp.attack.value=0.005; comp.release.value=0.25;
  master.connect(comp); comp.connect(ctx.destination);
  var rev=ctx.createConvolver(); rev.buffer=impulse(); var revOut=ctx.createGain(); revOut.gain.value=0.8; rev.connect(revOut); revOut.connect(master); revNode=rev;
  S.forEach(function(s){ if(s.buf) attach(s); });
}
function bufPos(time){ var p=time-t0; if(p<=0) return 0; return p<INTRO?p:INTRO+((p-INTRO)%(TOT-INTRO)); }
function newSource(s,when,offset){
  if(s.src){ try{ s.src.stop(when); }catch(e){} }
  var n=ctx.createBufferSource(); n.buffer=s.buf; n.loop=true; n.loopStart=INTRO; n.loopEnd=TOT; n.connect(s.g); n.start(when,offset); s.src=n;
}
function attach(s){
  var now=ctx.currentTime;
  if(!s.g){
    s.g=ctx.createGain(); s.g.gain.value=0;
    s.lp=ctx.createBiquadFilter(); s.lp.type='lowpass'; s.lp.frequency.value=18000; s.lp.Q.value=0.5;
    s.dry=ctx.createGain(); s.send=ctx.createGain(); s.send.gain.value=0;
    s.g.connect(s.lp);
    var tail=s.lp;
    if(ctx.createStereoPanner){ s.pn=ctx.createStereoPanner(); s.lp.connect(s.pn); tail=s.pn; }
    tail.connect(s.dry); s.dry.connect(master); tail.connect(s.send); s.send.connect(revNode);
    s.want=-1; s.pan=0; s.mu=0;      // al prossimo giro il modo rimette i suoi valori
  }
  if(playing) newSource(s,now+0.03,bufPos(now+0.03));   // chi arriva dopo si aggancia a tempo
}
/* fa partire il brano da un punto: 0 = dall'intro, INTRO = dal tema */
function startPiece(offset){
  var now=ctx.currentTime, ts=now+0.1;
  master.gain.cancelScheduledValues(now); master.gain.setTargetAtTime(0,now,0.02); master.gain.setTargetAtTime(2.0,ts,0.9);
  t0=ts-offset; playing=true;
  S.forEach(function(s){ if(s.g){ s.g.gain.cancelScheduledValues(now); s.g.gain.setTargetAtTime(0,now,0.02); s.want=-1; s.mu=-1; setRoom(s,0); newSource(s,ts,offset); } });
  if(ctx.state!=='running') ctx.resume();
  wantPlay=true; pauseBtn.setAttribute('aria-label','Pausa'); pauseIcon.setAttribute('d','M4.5 3h3v12h-3zM10.5 3h3v12h-3z');
}
function pos(){ return bufPos(ctx.currentTime); }
/* dissolvenze lunghe: niente entra di colpo */
function setWant(s,v,slow){
  if(!started||!playing) return;
  if(!s.g||Math.abs(v-s.want)<0.012) return;
  var up=v>s.want; s.want=v;
  if(slow==='now'){ s.g.gain.cancelScheduledValues(ctx.currentTime); s.g.gain.setValueAtTime(v,ctx.currentTime+0.12); s.gv=v; return; }
  s.g.gain.setTargetAtTime(v,ctx.currentTime,slow===2?(up?4.2:6.5):slow?(up?1.5:2.4):(up?0.55:0.9));
}
function setPan(s,p){ if(!started||!s.pn) return; if(Math.abs(p-s.pan)<0.03) return; s.pan=p; s.pn.pan.setTargetAtTime(p,ctx.currentTime,0.12); }
/* mu = quanto muro c'è in mezzo: 0 nella stessa stanza, 1 dall'altra parte */
function setRoom(s,mu){
  if(!ctx||!s.g) return; if(Math.abs(mu-s.mu)<0.02) return; s.mu=mu;
  var now=ctx.currentTime;
  s.lp.frequency.setTargetAtTime(18000*Math.pow(1400/18000,mu),now,0.5);
  s.send.gain.setTargetAtTime(0.65*mu,now,0.5);
  s.dry.gain.setTargetAtTime(1-0.3*mu,now,0.35);
}

/* ---- Griglia di aperture provvisoria: uno strato alla volta, il tutto solo al massimo ---- */
var MX={piano:1,arm1:.85,mel1:.8,mel2:.8,short1:.75,basso:.7,arm2:.5,short2:.5,short3:.45,short4:.55};
function barNow(){ return Math.floor((ctx.currentTime-t0)/(BEAT*4)); }
function barFrac(){ var x=(ctx.currentTime-t0)/(BEAT*4); return x-Math.floor(x); }
function ping(){ var o=ctx.createOscillator(), e=ctx.createGain(), n=ctx.currentTime; o.frequency.value=1318.5; e.gain.setValueAtTime(0,n); e.gain.linearRampToValueAtTime(0.05,n+0.01); e.gain.exponentialRampToValueAtTime(0.0002,n+1.1); o.connect(e); e.connect(ctx.destination); o.start(n); o.stop(n+1.2); }
function applyLadder(level,tc){
  ORDER10.forEach(function(id,k){ setWant(BY[id],k<=level?(level>=9?1:MX[id]):0,tc||true); });
}

/* ---- Palco ---- */
var cv=document.getElementById('stage'), g=cv.getContext('2d'), W=0,H=0,DPR=1,TOP=130,BOT=0;
var hintEl=document.getElementById('hint');
var pauseBtn=document.getElementById('pause'), pauseIcon=document.getElementById('pauseicon'), menuEl=document.getElementById('menu');
var INK='255,246,234', TAU=6.2832;
function resize(){
  var r=cv.getBoundingClientRect(); if(!r.width) return;
  W=r.width; H=r.height; DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  var pr=getComputedStyle(document.getElementById('probe')), st=parseFloat(pr.paddingTop)||0, sb=parseFloat(pr.paddingBottom)||0;
  TOP=st+78; BOT=H-sb-44; return; BOT=document.querySelector('.barbot').getBoundingClientRect().top-r.top-18;
}
window.addEventListener('resize',resize);
var P={};   // dita sullo schermo
function pt(e){var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',function(e){ if(!started) return; e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){ } var p=pt(e); P[e.pointerId]={x:p.x,y:p.y,px:p.x,py:p.y,t:performance.now()}; if(M.down) M.down(P[e.pointerId]); });
cv.addEventListener('pointermove',function(e){ var q=P[e.pointerId]; if(!q) return; var p=pt(e); q.px=q.x; q.py=q.y; q.x=p.x; q.y=p.y; if(M.move) M.move(q); });
function up(e){ var q=P[e.pointerId]; if(!q) return; delete P[e.pointerId]; if(M.up) M.up(q); }
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
function fingers(){ var a=[]; for(var k in P) a.push(P[k]); return a; }
function lvl(s){ return s.level; }

/* ================= I quattro modi ================= */
var MODES={};
function ss(a,b,x){ x=Math.max(0,Math.min(1,(x-a)/(b-a))); return x*x*(3-2*x); }

/* 1. risonanza: sfiori una corda e le vicine vibrano per simpatia */
MODES.risonanza=(function(){
  var ORDER=['short4','short2','basso','mel2','piano','arm1','mel1','short1','arm2','short3'], wake=[];
  function sx(i){ return W*0.1+i*(W*0.8/(ORDER.length-1)); }
  function excite(p){
    for(var i=0;i<ORDER.length;i++){
      var d=Math.abs(p.x-sx(i))/(W*0.8/(ORDER.length-1)), k=d<0.6?1:d<1.6?0.5:d<2.6?0.22:0;
      if(k>wake[i]) wake[i]=k;
    }
  }
  return {
    hint:'sfiora una corda. le altre rispondono.',
    enter:function(){ wake=ORDER.map(function(id){return id==='arm1'?0.7:0;}); },
    down:excite, move:excite,
    update:function(dt){
      fingers().forEach(excite);
      for(var i=0;i<ORDER.length;i++){
        wake[i]*=Math.exp(-dt/9);
        var floor=ORDER[i]==='arm1'?0.45:0, wv=Math.max(floor,wake[i]);
        setWant(BY[ORDER[i]],MX[ORDER[i]]*Math.max(0,Math.min(1,(wv-0.12)/0.6)),false);
      }
    },
    draw:function(t){
      var y0=TOP+10, y1=BOT-10, n=28; g.lineCap='round';
      for(var i=0;i<ORDER.length;i++){
        var s=BY[ORDER[i]], x=sx(i), amp=(2+16*lvl(s))*s.gv, a=0.14+0.82*s.gv;
        g.strokeStyle='rgba('+INK+','+a+')'; g.lineWidth=1.2+1.8*s.gv;
        g.beginPath();
        for(var k=0;k<=n;k++){ var u=k/n, y=y0+(y1-y0)*u, dx=Math.sin(Math.PI*u)*amp*Math.sin(t*(26+i*2.3)+i); if(k) g.lineTo(x+dx,y); else g.moveTo(x+dx,y); }
        g.stroke();
      }
    }
  };
})();

/* 2. palco: parti al centro e senti il brano intero, com'è, senza dissolvenze. Ogni cosa che entra si accende nel punto da cui arriva.
   Se ti sposti verso un punto lo senti da vicino, e il resto diventa un'eco */
MODES.stanza=(function(){
  var POSN={short1:[.5,.84],arm1:[.2,.68],short2:[.8,.68],piano:[.12,.44],mel2:[.88,.44],mel1:[.24,.24],basso:[.76,.24],arm2:[.5,.12],short3:[.16,.08],short4:[.84,.08]};
  var me={x:.5,y:.5}, tgt={x:.5,y:.5}, c=1, born={}, fresh=true, moved=false, still=0, call=null;
  function clampT(){ tgt.x=Math.max(0.03,Math.min(0.97,tgt.x)); tgt.y=Math.max(0.02,Math.min(0.98,tgt.y)); }
  function to(q){ tgt.x=q.x/W; tgt.y=(q.y-TOP)/(BOT-TOP); clampT(); moved=true; still=0; }
  return {
    hint:'', walk:true, fromIntro:true,
    enter:function(){ me={x:.5,y:.5}; tgt={x:.5,y:.5}; c=1; born={}; fresh=true; moved=false; still=0; call=null; },
    down:to, move:to,
    step:function(dir,frac){ var hh=BOT-TOP, f=frac||0.055; tgt.x+=Math.sin(dir)*f*hh/W; tgt.y-=Math.cos(dir)*f; clampT(); moved=true; still=0; },
    update:function(dt){
      var k=1-Math.exp(-dt/0.22); me.x+=(tgt.x-me.x)*k; me.y+=(tgt.y-me.y)*k; still+=dt;
      c=1-ss(0.08,0.24,Math.hypot(me.x-.5,me.y-.5));
      var tnow=performance.now()/1000, loud=null, lv=0;
      S.forEach(function(s){
        var p=POSN[s.id], d=Math.hypot(p[0]-me.x,p[1]-me.y);
        var pres=Math.max(1-ss(0.10,0.32,d),0.05*(1-ss(0.3,0.95,d)),c), mx=MX[s.id];
        setWant(s,(mx+(1-mx)*c)*pres,fresh&&s.g?'now':false);
        setRoom(s,ss(0.10,0.5,d)*(1-c));
        setPan(s,Math.max(-1,Math.min(1,(p[0]-me.x)*2.2)));
        if(s.level>0.12&&!born[s.id]) born[s.id]=tnow;      // la prima volta che suona: si accende dove sta
        if(born[s.id]&&s.level>lv&&d>0.14){ lv=s.level; loud=p; }
      });
      if(fresh&&S.some(function(s){return s.g;})) fresh=false;
      call=loud;
    },
    draw:function(t){
      var hh=BOT-TOP, sc=Math.min(1.15,W/390), mx=me.x*W, my=TOP+me.y*hh, tnow=performance.now()/1000;
      g.lineCap='round';
      S.forEach(function(s){
        if(!born[s.id]) return;                               // chi non è ancora entrato non c'è
        var p=POSN[s.id], x=p[0]*W, y=TOP+p[1]*hh, a=Math.max(0,Math.min(1,s.gv)), L=s.level, age=tnow-born[s.id];
        g.strokeStyle='rgba('+INK+','+(0.1+0.6*a*Math.min(1,0.25+L))+')'; g.lineWidth=0.75+1.1*a*L; g.beginPath(); g.moveTo(mx,my); g.lineTo(x,y); g.stroke();
        g.strokeStyle='rgba('+INK+','+(0.15+0.5*a)+')'; g.lineWidth=1; g.beginPath(); g.arc(x,y,(6+24*L)*sc,0,TAU); g.stroke();
        if(age<2.4){ var q=age/2.4; g.strokeStyle='rgba('+INK+','+0.7*(1-q)+')'; g.beginPath(); g.arc(x,y,(6+70*q)*sc,0,TAU); g.stroke(); }   // l'onda di quando entra
        g.fillStyle='rgba('+INK+','+(0.4+0.6*a)+')'; g.beginPath(); g.arc(x,y,(2.4+2.4*a)*sc,0,TAU); g.fill();
      });
      g.strokeStyle='rgba('+INK+','+(0.1+0.18*c)+')'; g.lineWidth=1; g.beginPath(); g.arc(W/2,TOP+hh/2,W*0.13,0,TAU); g.stroke();
      if(call&&(!moved||still>7)){                            // fermo: un'ombra di te parte verso chi sta suonando di più
        var ph=(t*0.4)%1, e=ph*ph*(3-2*ph), gx=mx+(call[0]*W-mx)*e, gy=my+(TOP+call[1]*hh-my)*e;
        g.strokeStyle='rgba(255,255,255,'+0.6*Math.sin(Math.PI*ph)+')'; g.lineWidth=1.25; g.beginPath(); g.arc(gx,gy,10,0,TAU); g.stroke();
      }
      g.fillStyle='#fff'; g.beginPath(); g.arc(mx,my,9,0,TAU); g.fill();
    }
  };
})();

/* 3. ricordarsi di sé: un dito fermo sei tu; con l'altro ti allontani, e il brano si apre quanto ti allarghi */
MODES.se=(function(){
  var v=0, anc=null, oth=null;
  function reach(){ return 0.72*Math.min(W,BOT-TOP); }
  return {
    hint:'un dito resta: sei tu. con l’altro allontanati, senza perderti.',
    enter:function(){ v=0; anc=null; oth=null; },
    down:function(q){ q.sx=q.x; q.sy=q.y; q.anchor=!fingers().some(function(f){return f!==q&&f.anchor&&!f.lost;}); },
    update:function(dt){
      anc=null; oth=null;
      fingers().forEach(function(q){
        if(q.anchor){ if(Math.hypot(q.x-q.sx,q.y-q.sy)>46) q.lost=true; if(!q.lost) anc=q; }
        else if(!oth) oth=q;
      });
      if(anc&&oth){ var tv=Math.min(9.6,Math.hypot(oth.x-anc.x,oth.y-anc.y)/reach()*9.6); v+=(tv-v)*(1-Math.exp(-dt/0.7)); }
      else if(anc) v=Math.max(0,v-dt/20);

      applyLadder(Math.floor(v+0.001));
    },
    draw:function(t){
      g.lineCap='round'; g.font='600 15px '+FONT; g.textAlign='center'; g.textBaseline='middle';
      if(!anc){
        var hx=W/2, hy=BOT-70, pr=30+3*Math.sin(t*2);
        g.strokeStyle='rgba('+INK+',.5)'; g.lineWidth=1.25; g.beginPath(); g.arc(hx,hy,pr,0,TAU); g.stroke();
        g.fillStyle='rgba(245,245,247,.7)'; g.fillText('tu',hx,hy); return;
      }
      var R=reach(), lv=Math.floor(v+0.001);
      for(var i=1;i<=9;i++){ g.strokeStyle='rgba('+INK+','+(i<=lv?0.34:0.08)+')'; g.lineWidth=1; g.beginPath(); g.arc(anc.sx,anc.sy,R*i/9.6,0,TAU); g.stroke(); }
      if(oth){
        g.strokeStyle='rgba('+INK+',.5)'; g.lineWidth=1; g.beginPath(); g.moveTo(anc.sx,anc.sy); g.lineTo(oth.x,oth.y); g.stroke();
        g.strokeStyle='rgba('+INK+',.95)'; g.lineWidth=1.5; g.beginPath(); g.arc(oth.x,oth.y,24,0,TAU); g.stroke();
      }
      g.fillStyle='rgba('+INK+',.96)'; g.beginPath(); g.arc(anc.sx,anc.sy,28,0,TAU); g.fill();

/* 4. tre centri: la musica sta nei legami tra le parti, e i legami vanno tenuti vivi.
   Si parte dal solo tappeto degli archi, lontano e velato. Ogni legame apre qualcosa; quando i tre legami vivono insieme, la figura cresce.
   Tre prove della stessa idea: cerchio, triangolo, anelli. */
var CL=[['piano','mel1','mel2'],['short1','basso','arm2'],['short2','short3','short4']], CTH=[0.1,0.42,0.72], CNAME=['mente','cuore','corpo'];
function centriAudio(s,syn){
  var tot=(s[0]+s[1]+s[2])/3;
  setWant(BY.arm1,MX.arm1*(0.55+0.45*Math.min(1,tot*2))+(1-MX.arm1)*syn,true);
  setRoom(BY.arm1,0.85*(1-Math.min(1,tot*2.2)));
  for(var i=0;i<3;i++) CL[i].forEach(function(id,k){
    setWant(BY[id],ss(CTH[k],CTH[k]+0.18,s[i])*(MX[id]+(1-MX[id])*syn),true);
    setRoom(BY[id],0.6*(1-ss(CTH[k],CTH[k]+0.45,s[i]))*(1-syn));
  });
}
function synStep(syn,s,dt){ return Math.max(0,Math.min(1,syn+(Math.min(s[0],s[1],s[2])>0.3?dt/22:-dt/7))); }
function tinyLabel(txt,x,y,a){ if(a<=0.01) return; g.font='300 10px Unbounded, '+FONT; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='rgba(245,245,247,'+a+')'; g.fillText(txt,x,y); }
function ghost(x,y,ph){ g.strokeStyle='rgba(255,255,255,'+0.55*Math.sin(Math.PI*ph)+')'; g.lineWidth=1.25; g.beginPath(); g.arc(x,y,11,0,TAU); g.stroke(); }
function centriMode(kind){
  var s=[0,0,0], syn=0, rot=0, used=false, A0=-Math.PI/2;
  function R(){ return Math.min(W*0.37,(BOT-TOP)*0.3); }
  function cx(){ return W/2; } function cy(){ return (TOP+BOT)/2+(kind==='tri'?R()*0.12:0); }
  function ang(i){ return A0+i*TAU/3; }
  function nd(i){ return {x:cx()+R()*Math.cos(ang(i)),y:cy()+R()*Math.sin(ang(i))}; }
  function touch(q){
    var h=-1; for(var i=0;i<3;i++){ var n=nd(i); if(Math.hypot(q.x-n.x,q.y-n.y)<54) h=i; }
    if(h<0) return;
    if(q.last>=0&&q.last!==h){ s[(q.last+1)%3===h?q.last:h]=1; used=true; }
    q.last=h;
  }
  function tri(r,a,al,lw){ if(al<=0.004) return; g.strokeStyle='rgba('+INK+','+al+')'; g.lineWidth=lw||1; g.beginPath(); for(var i=0;i<3;i++){ var x=cx()+r*Math.cos(a+i*TAU/3), y=cy()+r*Math.sin(a+i*TAU/3); if(i) g.lineTo(x,y); else g.moveTo(x,y); } g.closePath(); g.stroke(); }
  return {
    hint:'',
    enter:function(){ s=[0,0,0]; syn=0; rot=0; used=false; },
    down:function(q){ q.last=-1; touch(q); }, move:touch,
    update:function(dt){
      for(var i=0;i<3;i++) s[i]=Math.max(0,s[i]-dt/(15+12*syn));
      syn=synStep(syn,s,dt); rot+=dt*0.07*syn;
      centriAudio(s,syn);
    },
    draw:function(t){
      var r=R(), x0=cx(), y0=cy(), i, n, a, b, br=1+0.05*BY.arm1.level, live=Math.min(s[0],s[1],s[2]);
      g.lineCap='round'; g.lineJoin='round';
      if(kind==='cerchio'){
        g.strokeStyle='rgba('+INK+',.13)'; g.lineWidth=1; g.beginPath(); g.arc(x0,y0,r,0,TAU); g.stroke();
        for(i=0;i<3;i++){ if(s[i]>0.004){ g.strokeStyle='rgba('+INK+','+(0.9*s[i])+')'; g.lineWidth=1+2.2*s[i]; g.beginPath(); g.arc(x0,y0,r,ang(i),ang(i+1)); g.stroke(); } }
        for(i=0;i<3;i++){ a=nd(i); b=nd((i+1)%3); if(s[i]>0.004){ g.strokeStyle='rgba('+INK+','+0.45*s[i]+')'; g.lineWidth=1; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); } }   // il cerchio, unito dal triangolo
        n=Math.floor(syn*9);                                   // insieme: il triangolo si moltiplica dentro il cerchio e gira
        for(i=1;i<=n;i++) tri(r*br,A0+rot+i*(TAU/3)/(n+1),0.5*Math.min(1,syn*9-i+1)*(0.45+0.55*live),1);
        if(syn>0.03){ g.strokeStyle='rgba('+INK+','+0.5*syn+')'; g.lineWidth=1; g.beginPath(); g.arc(x0,y0,r*(1.16+0.03*Math.sin(t*0.9)),0,TAU); g.stroke(); }
      } else {
        for(i=0;i<3;i++){ a=nd(i); b=nd((i+1)%3); g.strokeStyle='rgba('+INK+','+(0.13+0.8*s[i])+')'; g.lineWidth=1+2.2*s[i]; g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); }
        n=Math.floor(syn*18); var th=0.16+0.07*Math.sin(t*0.13), f=1/(Math.cos(th)+Math.sin(th)*1.732);    // insieme: triangoli uno dentro l'altro, a spirale
        for(i=1;i<=n;i++) tri(r*br*Math.pow(f,i),A0+rot+i*th,0.75*Math.min(1,syn*18-i+1)*Math.pow(0.9,i)*(0.4+0.6*live),1);
        if(syn>0.5){ g.strokeStyle='rgba('+INK+','+0.5*(syn-0.5)*2+')'; g.lineWidth=1; g.beginPath(); g.arc(x0,y0,r,0,TAU); g.stroke(); }
      }
      for(i=0;i<3;i++){
        var p=nd(i), e=Math.max(s[i],s[(i+2)%3]);
        g.strokeStyle='rgba('+INK+','+(0.3+0.5*e)+')'; g.lineWidth=1; g.beginPath(); g.arc(p.x,p.y,9+9*e,0,TAU); g.stroke();
        g.fillStyle='#000'; g.beginPath(); g.arc(p.x,p.y,4.5,0,TAU); g.fill();
        g.fillStyle='rgba('+INK+','+(0.45+0.55*e)+')'; g.beginPath(); g.arc(p.x,p.y,3+1.5*e,0,TAU); g.fill();
        tinyLabel(CNAME[i],x0+(r+40)*Math.cos(ang(i)),y0+(r+40)*Math.sin(ang(i)),0.5*(1-syn));
      }
      fingers().forEach(function(q){ if(q.last>=0){ var p=nd(q.last); g.strokeStyle='rgba('+INK+',.4)'; g.lineWidth=1; g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(q.x,q.y); g.stroke(); } });
      if(!used&&!fingers().length){
        var ph=(t*0.35)%1, k=ph*ph*(3-2*ph);
        if(kind==='cerchio') ghost(x0+r*Math.cos(ang(0)+k*TAU/3),y0+r*Math.sin(ang(0)+k*TAU/3),ph);
        else { a=nd(0); b=nd(1); ghost(a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k,ph); }
      }
    }
  };
}
MODES.centri=centriMode('cerchio');
MODES.centri2=centriMode('tri');

/* tre anelli: ognuno tende ad andarsene per conto suo. Avvicinali: dove si sovrappongono nasce la musica. Lasciati soli, si separano di nuovo */
MODES.centri3=(function(){
  var c=[], s=[0,0,0], syn=0, used=false, HOME=1.3;
  function r(){ return Math.min(W*0.22,(BOT-TOP)*0.17); }
  function x0(){ return W/2; } function y0(){ return (TOP+BOT)/2; }
  function hx(i){ return HOME*Math.cos(-Math.PI/2+i*TAU/3); } function hy(i){ return HOME*Math.sin(-Math.PI/2+i*TAU/3); }
  function px(i){ return x0()+c[i].x*r(); } function py(i){ return y0()+c[i].y*r(); }
  return {
    hint:'',
    enter:function(){ c=[0,1,2].map(function(i){ return {x:hx(i),y:hy(i),held:0}; }); s=[0,0,0]; syn=0; used=false; },
    down:function(q){ var best=-1,bd=1e9; for(var i=0;i<3;i++){ var d=Math.hypot(q.x-px(i),q.y-py(i)); if(d<r()*1.15&&d<bd&&!c[i].held){ bd=d; best=i; } } q.c=best; if(best>=0){ c[best].held++; q.ox=q.x-px(best); q.oy=q.y-py(best); used=true; } },
    move:function(q){ if(q.c>=0){ c[q.c].x=(q.x-q.ox-x0())/r(); c[q.c].y=(q.y-q.oy-y0())/r(); } },
    up:function(q){ if(q.c>=0) c[q.c].held=Math.max(0,c[q.c].held-1); },
    update:function(dt){
      var k=1-Math.exp(-dt/16), i;
      for(i=0;i<3;i++) if(!c[i].held){ c[i].x+=(hx(i)-c[i].x)*k; c[i].y+=(hy(i)-c[i].y)*k; }
      for(i=0;i<3;i++){ var j=(i+1)%3, d=Math.hypot(c[i].x-c[j].x,c[i].y-c[j].y); s[i]+=(ss(2.05,0.8,d)-s[i])*(1-Math.exp(-dt/0.5)); }
      syn=synStep(syn,s,dt); centriAudio(s,syn);
    },
    draw:function(t){
      var rr=r(), i, j, br=1+0.04*BY.arm1.level;
      for(i=0;i<3;i++){ j=(i+1)%3; if(s[i]>0.01){ g.save(); g.beginPath(); g.arc(px(i),py(i),rr,0,TAU); g.clip(); g.fillStyle='rgba('+INK+','+(0.05+0.2*s[i])+')'; g.beginPath(); g.arc(px(j),py(j),rr,0,TAU); g.fill(); g.restore(); } }
      if(syn>0.02){ var mx=(px(0)+px(1)+px(2))/3, my=(py(0)+py(1)+py(2))/3;      // insieme: dal centro partono onde
        for(i=0;i<5;i++){ var u=((t*0.07+i/5)%1); g.strokeStyle='rgba('+INK+','+0.55*syn*(1-u)*Math.min(1,u*6)+')'; g.lineWidth=1; g.beginPath(); g.arc(mx,my,rr*(0.2+2.6*u),0,TAU); g.stroke(); } }
      for(i=0;i<3;i++){
        var e=Math.max(s[i],s[(i+2)%3]);
        g.strokeStyle='rgba('+INK+','+(0.32+0.6*e)+')'; g.lineWidth=1+0.8*e; g.beginPath(); g.arc(px(i),py(i),rr*br,0,TAU); g.stroke();
        tinyLabel(CNAME[i],px(i),py(i),0.5*(1-ss(0,0.4,e)));
      }
      if(!used){ var ph=(t*0.35)%1, k=ph*ph*(3-2*ph)*0.6; g.strokeStyle='rgba(255,255,255,'+0.4*Math.sin(Math.PI*ph)+')'; g.lineWidth=1; g.beginPath(); g.arc(px(0)+(x0()-px(0))*k,py(0)+(y0()-py(0))*k,rr,0,TAU); g.stroke(); }
    }
  };
})();

/* ================= Oriente ================= */
var REST=['piano','mel1','mel2','short1','basso','arm2','short2','short3','short4'];
function padOn(full){ setWant(BY.arm1,MX.arm1*0.8+(1-MX.arm1*0.8)*full,true); }
function vol(id,a,full){ setWant(BY[id],a*(MX[id]+(1-MX[id])*full),true); }

/* esagramma: sei linee. Spezzata tace, intera suona. Tutte intere: il cielo, e arriva anche il resto */
MODES.esagramma=(function(){
  var ST=['piano','mel1','mel2','short1','basso','arm2'], on=[], a=[], tf=0, used=false;
  function h(){ return Math.min(58,(BOT-TOP)*0.095); } function yy(i){ return (TOP+BOT)/2+(2.5-i)*h(); }
  return {
    hint:'',
    enter:function(){ on=[0,0,0,0,0,0]; a=[0,0,0,0,0,0]; tf=0; used=false; },
    down:function(q){ var i=Math.round(2.5-(q.y-(TOP+BOT)/2)/h()); if(i>=0&&i<6){ on[i]=on[i]?0:1; used=true; } },
    update:function(dt){
      var all=on.every(function(v){return v;}); tf=all?tf+dt:Math.max(0,tf-dt*4);
      var full=ss(22,34,tf); padOn(full);
      ST.forEach(function(id,i){ a[i]+=(on[i]-a[i])*(1-Math.exp(-dt/0.18)); vol(id,on[i],full); });
      vol('short2',tf>3?1:0,full); vol('short3',tf>10?1:0,full); vol('short4',tf>17?1:0,full);
    },
    draw:function(t){
      var wb=W*0.58, xa=(W-wb)/2, i;
      for(i=0;i<6;i++){
        var y=yy(i), L=BY[ST[i]].level, th=7+7*L*a[i], gap=wb*0.15*(1-a[i]), al=0.2+0.75*a[i];
        if(!used&&i===0) al+=0.25*(0.5+0.5*Math.sin(t*2.2));
        g.fillStyle='rgba('+INK+','+al+')';
        g.fillRect(xa,y-th/2,wb/2-gap/2,th); g.fillRect(xa+wb/2+gap/2,y-th/2,wb/2-gap/2,th);
      }
      ['short2','short3','short4'].forEach(function(id,k){ var v=BY[id].gv; if(v>0.01){ g.strokeStyle='rgba('+INK+','+0.5*v+')'; g.lineWidth=1; g.beginPath(); g.arc(W/2,(TOP+BOT)/2,h()*(4.1+0.55*k)+6*BY[id].level,0,TAU); g.stroke(); } });
    }
  };
})();

/* perle: nove fili, una perla per filo. Spingila in alto e il suo suono si apre */
MODES.perle=(function(){
  var v=[], tg=[], used=false;
  function xx(i){ return W*0.1+i*W*0.8/8; } function ya(){ return TOP+(BOT-TOP)*0.14; } function yb(){ return BOT-(BOT-TOP)*0.14; }
  function set(q){ if(q.i<0) return; tg[q.i]=Math.max(0,Math.min(1,(yb()-q.y)/(yb()-ya()))); }
  return {
    hint:'',
    enter:function(){ v=REST.map(function(){return 0;}); tg=v.slice(); used=false; },
    down:function(q){ var i=Math.round((q.x-W*0.1)/(W*0.8/8)); q.i=(i>=0&&i<9&&q.y>ya()-40&&q.y<yb()+40)?i:-1; if(q.i>=0) used=true; set(q); },
    move:set,
    update:function(dt){
      var full=1; REST.forEach(function(id,i){ v[i]+=(tg[i]-v[i])*(1-Math.exp(-dt/0.12)); if(v[i]<0.9) full=0; });
      padOn(full); REST.forEach(function(id,i){ vol(id,ss(0.06,0.94,v[i]),full); });
    },
    draw:function(t){
      var rad=Math.min(15,W*0.8/8*0.4), i;
      g.strokeStyle='rgba('+INK+',.22)'; g.lineWidth=1; g.beginPath(); g.moveTo(xx(0)-rad,ya()-rad-10); g.lineTo(xx(8)+rad,ya()-rad-10); g.stroke();
      for(i=0;i<9;i++){
        var x=xx(i), y=yb()-(yb()-ya())*v[i], L=BY[REST[i]].level;
        g.strokeStyle='rgba('+INK+',.13)'; g.lineWidth=1; g.beginPath(); g.moveTo(x,ya()-rad-10); g.lineTo(x,yb()+rad); g.stroke();
        if(v[i]>0.04){ g.strokeStyle='rgba('+INK+','+0.5*v[i]+')'; g.beginPath(); g.arc(x,y,rad+3+10*L*v[i],0,TAU); g.stroke(); }
        g.fillStyle='#000'; g.beginPath(); g.arc(x,y,rad,0,TAU); g.fill();
        g.fillStyle='rgba('+INK+','+(0.16+0.8*v[i])+')'; g.beginPath(); g.arc(x,y,rad,0,TAU); g.fill();
        g.strokeStyle='rgba('+INK+',.5)'; g.lineWidth=1; g.beginPath(); g.arc(x,y,rad,0,TAU); g.stroke();
      }
      if(!used){ var ph=(t*0.35)%1, k=ph*ph*(3-2*ph); ghost(xx(4),yb()-(yb()-ya())*0.7*k,ph); }
    }
  };
})();

/* go: posa una pietra. Ogni pietra apre ciò che ha intorno; col tempo le pietre svaniscono, e il gioco continua */
MODES.go=(function(){
  var N=9, stones={}, turn=0, used=false, STAR=[[4,4,'piano'],[2,6,'mel1'],[6,6,'mel2'],[4,6,'short1'],[4,2,'basso'],[2,4,'arm2'],[6,4,'short2'],[2,2,'short3'],[6,2,'short4']];
  function cell(){ return Math.min(W*0.86,(BOT-TOP)*0.82)/(N-1); }
  function gx(i){ return W/2+(i-4)*cell(); } function gy(j){ return (TOP+BOT)/2+(j-4)*cell(); }
  function F(d){ return d<0.1?1:d<1.1?0.55:d<1.5?0.34:d<2.1?0.15:0; }
  return {
    hint:'',
    enter:function(){ stones={}; turn=0; used=false; },
    down:function(q){ var i=Math.round((q.x-W/2)/cell())+4, j=Math.round((q.y-(TOP+BOT)/2)/cell())+4; if(i<0||j<0||i>=N||j>=N) return; var k=i+','+j; used=true; if(stones[k]) delete stones[k]; else stones[k]={i:i,j:j,life:1,born:performance.now()/1000,w:(turn++)%2}; },
    update:function(dt){
      var k, st, inf={}, full=1;
      for(k in stones){ st=stones[k]; st.life-=dt/55; if(st.life<=0) delete stones[k]; }
      STAR.forEach(function(sp){ var v=0; for(k in stones){ st=stones[k]; v+=Math.min(1,st.life*4)*F(Math.hypot(st.i-sp[0],st.j-sp[1])); } v=Math.min(1,v); inf[sp[2]]=v; if(v<0.6) full=0; });
      padOn(full); STAR.forEach(function(sp){ vol(sp[2],inf[sp[2]],full); });
    },
    draw:function(t){
      var c=cell(), i, k, tn=performance.now()/1000;
      g.strokeStyle='rgba('+INK+',.1)'; g.lineWidth=1; g.beginPath();
      for(i=0;i<N;i++){ g.moveTo(gx(i),gy(0)); g.lineTo(gx(i),gy(N-1)); g.moveTo(gx(0),gy(i)); g.lineTo(gx(N-1),gy(i)); } g.stroke();
      STAR.forEach(function(sp){ var s=BY[sp[2]], x=gx(sp[0]), y=gy(sp[1]);
        g.fillStyle='rgba('+INK+','+(0.3+0.5*s.gv)+')'; g.beginPath(); g.arc(x,y,2,0,TAU); g.fill();
        if(s.gv>0.03){ g.strokeStyle='rgba('+INK+','+0.4*s.gv+')'; g.beginPath(); g.arc(x,y,c*(0.62+0.5*s.level),0,TAU); g.stroke(); } });
      for(k in stones){ var st=stones[k], a=Math.min(1,st.life*4), x=gx(st.i), y=gy(st.j), age=tn-st.born, rr=c*0.42*(age<0.25?0.6+1.6*age:1);
        g.fillStyle='#000'; g.beginPath(); g.arc(x,y,rr,0,TAU); g.fill();
        if(st.w){ g.fillStyle='rgba('+INK+','+0.92*a+')'; g.beginPath(); g.arc(x,y,rr,0,TAU); g.fill(); }
        else { g.strokeStyle='rgba('+INK+','+0.8*a+')'; g.lineWidth=1.25; g.beginPath(); g.arc(x,y,rr-0.6,0,TAU); g.stroke(); } }
      if(!used){ var ph=(t*0.35)%1; ghost(gx(4),gy(4),ph); }
    }
  };
})();

/* giardino: passa il rastrello nella sabbia. Le pietre attorno a cui passi si svegliano; poi la sabbia torna liscia */
MODES.giardino=(function(){
  var ROCK=[[.5,.5,'piano'],[.24,.3,'mel1'],[.76,.34,'mel2'],[.3,.7,'short1'],[.72,.74,'basso'],[.5,.14,'arm2'],[.12,.52,'short2'],[.88,.56,'short3'],[.5,.9,'short4']];
  var e=[], pts=[], used=false, LIFE=38;
  function rx(k){ return ROCK[k][0]*W; } function ry(k){ return TOP+ROCK[k][1]*(BOT-TOP); }
  function rake(q){
    var tn=performance.now()/1000, l=pts[pts.length-1], d=l&&!l.brk?Math.hypot(q.x-l.x,q.y-l.y):1e9;
    if(d<7) return; var nx=0, ny=0; if(d<1e8){ nx=-(q.y-l.y)/d; ny=(q.x-l.x)/d; if(l.nx===0&&l.ny===0){ l.nx=nx; l.ny=ny; } }
    pts.push({x:q.x,y:q.y,t:tn,nx:nx,ny:ny,first:d>1e8}); if(pts.length>1400) pts.shift();
    if(d<1e8) for(var k=0;k<9;k++){ var dd=Math.hypot(q.x-rx(k),q.y-ry(k)); e[k]=Math.min(1,e[k]+d/520*(1-ss(W*0.06,W*0.3,dd))); }
    used=true;
  }
  return {
    hint:'',
    enter:function(){ e=ROCK.map(function(){return 0;}); pts=[]; used=false; },
    down:rake, move:rake, up:function(){ if(pts.length) pts[pts.length-1].brk=true; },
    update:function(dt){
      var full=1; for(var k=0;k<9;k++){ e[k]=Math.max(0,e[k]-dt/32); if(e[k]<0.55) full=0; }
      padOn(full); ROCK.forEach(function(r,k){ vol(r[2],ss(0.05,0.7,e[k]),full); });
      var tn=performance.now()/1000; while(pts.length&&tn-pts[0].t>LIFE) pts.shift();
    },
    draw:function(t){
      var tn=performance.now()/1000, o, i, k;
      g.lineCap='round'; g.lineJoin='round'; g.lineWidth=1;
      for(o=-2;o<=2;o++){                                        // cinque denti
        for(i=1;i<pts.length;i++){ var a=pts[i-1], b=pts[i]; if(b.first||a.brk) continue;
          g.strokeStyle='rgba('+INK+','+0.42*Math.pow(1-(tn-b.t)/LIFE,1.5)+')'; g.beginPath(); g.moveTo(a.x+a.nx*o*7,a.y+a.ny*o*7); g.lineTo(b.x+b.nx*o*7,b.y+b.ny*o*7); g.stroke(); }
      }
      for(k=0;k<9;k++){ var x=rx(k), y=ry(k), s=BY[ROCK[k][2]], n=1+Math.floor(e[k]*4.99);
        for(i=1;i<=n;i++){ g.strokeStyle='rgba('+INK+','+(i===1?0.2+0.5*e[k]:0.45*e[k]*(1-i/7))+')'; g.beginPath(); g.arc(x,y,5+i*8+(i>1?4*s.level:0),0,TAU); g.stroke(); }
        g.fillStyle='rgba('+INK+','+(0.35+0.65*e[k])+')'; g.beginPath(); g.arc(x,y,4,0,TAU); g.fill(); }
      if(!used){ var ph=(t*0.3)%1, an=ph*TAU; ghost(rx(0)+34*Math.cos(an),ry(0)+34*Math.sin(an),Math.min(1,ph*1.2)); }
    }
  };
})();

/* ensō: un solo gesto. Quanto chiudi il cerchio, tanto si apre il brano; poi l'inchiostro asciuga, e si ricomincia */
MODES.enso=(function(){
  var pts=[], acc=0, ink=0, drawing=null, v=0, used=false;
  function ax(q){ return Math.atan2(q.y-(TOP+BOT)/2,q.x-W/2); }
  return {
    hint:'',
    enter:function(){ pts=[]; acc=0; ink=0; drawing=null; v=0; used=false; },
    down:function(q){ if(drawing) return; drawing=q; pts=[{x:q.x,y:q.y,w:5}]; acc=0; ink=1; q.a=ax(q); used=true; },
    move:function(q){ if(q!==drawing) return; var l=pts[pts.length-1], d=Math.hypot(q.x-l.x,q.y-l.y); if(d<4) return;
      var a=ax(q), da=a-q.a; if(da>Math.PI) da-=TAU; if(da<-Math.PI) da+=TAU; acc+=da; q.a=a;
      var w=Math.max(4,Math.min(24,26-d*0.9)); pts.push({x:q.x,y:q.y,w:l.w+(w-l.w)*0.25}); },
    up:function(q){ if(q===drawing) drawing=null; },
    update:function(dt){
      if(!drawing) ink=Math.max(0,ink-dt/48);
      var tv=Math.min(1,Math.abs(acc)/(TAU*0.97))*Math.min(1,ink*1.6); v+=(tv-v)*(1-Math.exp(-dt/0.6));
      applyLadder(Math.floor(v*9.3+0.001),true);
    },
    draw:function(t){
      g.lineCap='round';
      g.strokeStyle='rgba('+INK+','+(used?0.05:0.1+0.06*Math.sin(t*1.6))+')'; g.lineWidth=1; g.beginPath(); g.arc(W/2,(TOP+BOT)/2,Math.min(W*0.34,(BOT-TOP)*0.3),0,TAU); g.stroke();
      var al=0.92*Math.min(1,ink*1.6);
      for(var i=1;i<pts.length;i++){ g.strokeStyle='rgba('+INK+','+al+')'; g.lineWidth=pts[i].w; g.beginPath(); g.moveTo(pts[i-1].x,pts[i-1].y); g.lineTo(pts[i].x,pts[i].y); g.stroke(); }
      if(!used){ var ph=(t*0.2)%1, R=Math.min(W*0.34,(BOT-TOP)*0.3), an=-2.2+ph*TAU; ghost(W/2+R*Math.cos(an),(TOP+BOT)/2+R*Math.sin(an),Math.min(1,ph*1.1)); }
    }
  };
})();


var walkBtn=document.getElementById('walk'), calBtn=document.getElementById('cal'), walking=false, h0=null, head=0, lastStep=0, grav=9.8, gotMotion=false, wake=null;
var CAL=null, calib=null, calData=null; try{ CAL=JSON.parse(localStorage.getItem('racconti-passo')||'null'); }catch(e){}
function onMotion(e){
  var a=e.accelerationIncludingGravity; if(!a||a.x==null) return; gotMotion=true;
  var m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z); grav+=(m-grav)*0.05;
  var now=performance.now(), hp=m-grav, thr=CAL&&CAL.thr||1.3;
  if(calib) calib.samples.push([Math.round(now-calib.t0),Math.round(hp*100)/100]);
  if(hp>thr&&now-lastStep>320){
    lastStep=now;
    if(calib){ calib.n++; calBtn.textContent='arrivo · '+calib.n+' passi'; }
    if(current&&M.step) M.step(CAL&&typeof CAL.head==='number'?head-CAL.head:(h0===null?0:head-h0), CAL&&CAL.steps?0.9/CAL.steps:0);
  }
}
/* taratura: partenza, cammini fino in fondo alla stanza, arrivo. Da lì il passo e la direzione sono i tuoi */
function median(a){ var s=a.slice().sort(function(x,y){return x-y;}); return s.length?s[Math.floor(s.length/2)]:0; }
function countSteps(sm,th){ var n=0,last=-1e9; sm.forEach(function(p){ if(p[1]>th&&p[0]-last>320){ n++; last=p[0]; } }); return n; }
calBtn.addEventListener('click',function(){
  if(calData){ var txt=JSON.stringify(calData); calData=null; calBtn.textContent='tara di nuovo';
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ calBtn.textContent='dati copiati · tara di nuovo'; }).catch(function(){});
    return; }
  if(!calib){ calib={n:0,samples:[],heads:[],t0:performance.now()}; calBtn.classList.add('on'); calBtn.textContent='arrivo · 0 passi'; return; }
  var c=calib; calib=null; calBtn.classList.remove('on');
  var peaks=[], run=0; c.samples.forEach(function(p){ if(p[1]>0.4) run=Math.max(run,p[1]); else if(p[1]<0.2&&run){ peaks.push(run); run=0; } });
  var thr=Math.max(0.7,Math.min(2.5,0.5*median(peaks))), n=countSteps(c.samples,thr);
  if(n<3){ calBtn.textContent='troppo pochi passi, riprova'; return; }
  var sx=0, sy=0; c.heads.forEach(function(h){ sx+=Math.sin(h); sy+=Math.cos(h); });
  CAL={steps:n,thr:Math.round(thr*100)/100}; if(c.heads.length) CAL.head=Math.atan2(sx,sy);
  try{ localStorage.setItem('racconti-passo',JSON.stringify(CAL)); }catch(e){}
  calData={passi:n,soglia:CAL.thr,direzione_gradi:typeof CAL.head==='number'?Math.round(CAL.head*180/Math.PI):null,durata_s:Math.round((performance.now()-c.t0)/100)/10,picchi:{numero:peaks.length,mediana:Math.round(median(peaks)*100)/100,min:peaks.length?Math.min.apply(null,peaks):0,max:peaks.length?Math.max.apply(null,peaks):0},campioni:c.samples.length,serie:c.samples.filter(function(_,i){return i%3===0;})};
  calBtn.textContent=n+' passi · copia dati';
});
function onOrient(e){
  var h=typeof e.webkitCompassHeading==='number'?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);
  if(h==null) return; head=h*Math.PI/180; if(h0===null) h0=head; if(calib) calib.heads.push(head);
}
function stopWalk(){
  if(!walking) return; walking=false; window.removeEventListener('devicemotion',onMotion); window.removeEventListener('deviceorientation',onOrient);
  walkBtn.classList.remove('on'); walkBtn.textContent='cammina'; calBtn.hidden=true; calib=null; calBtn.classList.remove('on'); if(wake){ try{wake.release();}catch(e){} wake=null; }
}
walkBtn.addEventListener('click',function(){
  if(walking){ stopWalk(); return; }
  if(!window.DeviceMotionEvent){ walkBtn.textContent='questo dispositivo non ha sensori'; return; }
  var ask=typeof DeviceMotionEvent.requestPermission==='function'?DeviceMotionEvent.requestPermission():Promise.resolve('granted');
  ask.then(function(r){
    if(r!=='granted') throw new Error('no');
    return (window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')?DeviceOrientationEvent.requestPermission():'granted';
  }).then(function(){
    h0=null; gotMotion=false; walking=true; window.addEventListener('devicemotion',onMotion); window.addEventListener('deviceorientation',onOrient);
    walkBtn.classList.add('on'); walkBtn.textContent='cammina: attivo'; calBtn.hidden=false; calData=null; calBtn.textContent=CAL?'tarato su '+CAL.steps+' passi · rifai':'tara';
    if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});
    setTimeout(function(){ if(walking&&!gotMotion){ stopWalk(); walkBtn.textContent='qui i sensori sono bloccati'; } },2500);
  }).catch(function(){ walkBtn.textContent='sensori non concessi'; });
});
var M=MODES.stanza, FONT=getComputedStyle(document.body).fontFamily;
var hintTimer=null, current=null, ctlTimer=null;
function showCtl(){ vLab.classList.add('ctlon'); clearTimeout(ctlTimer); ctlTimer=setTimeout(function(){ if(!walking||true) vLab.classList.remove('ctlon'); },4500); }
document.getElementById('zone').addEventListener('pointerdown',function(e){ e.preventDefault(); showCtl(); });
document.querySelector('.bartop').addEventListener('pointerdown',function(){ if(current) showCtl(); });
document.querySelector('.barbot').addEventListener('pointerdown',function(){ if(current) showCtl(); });
function showMenu(){
  current=null; vLab.classList.add('inmenu'); menuEl.classList.remove('off'); hintEl.classList.remove('show'); walkBtn.hidden=true; stopWalk();
  if(started){ playing=false; master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0,ctx.currentTime,0.25); setTimeout(function(){ if(!current&&ctx) ctx.suspend(); },900); }
}
/* ogni modo riparte da capo: la stanza dall'intro, gli altri dal tema, sopra gli archi lunghi */
function enterMode(name){
  startAudio();
  current=name; M=MODES[name]; M.enter();
  vLab.classList.remove('inmenu'); vLab.classList.remove('ctlon'); menuEl.classList.add('off');
  hintEl.textContent='';
  walkBtn.hidden=!M.walk; resize();
  whenReady.then(function(){ if(current===name){ S.forEach(function(s){ if(s.g) setPan(s,0); }); startPiece(M.fromIntro?0:INTRO); } });
}
menuEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) enterMode(b.getAttribute('data-m')); });
document.getElementById('back').addEventListener('click',function(){ if(current) showMenu(); else location.hash='#home'; });
var progEl=document.getElementById('prog');
document.getElementById('again').addEventListener('click',function(){ if(!started||!current) return; M.enter(); startPiece(M.fromIntro?0:INTRO); });
pauseBtn.addEventListener('click',function(){
  if(!started||!current) return;
  wantPlay=!wantPlay;
  if(wantPlay){ctx.resume(); pauseBtn.setAttribute('aria-label','Pausa'); pauseIcon.setAttribute('d','M4.5 3h3v12h-3zM10.5 3h3v12h-3z');}
  else{ctx.suspend(); pauseBtn.setAttribute('aria-label','Riprendi'); pauseIcon.setAttribute('d','M5.5 3l9 6-9 6z');}
});
var readyRes, whenReady=new Promise(function(r){ readyRes=r; });
function startAudio(){
  if(ctx) return;
  var AC=window.AudioContext||window.webkitAudioContext;
  try{ ctx=new AC(); ctx.resume(); }catch(e){ hintEl.textContent='questo browser non suona'; hintEl.classList.add('show'); return; }
  prepare().catch(function(){});
  firstReady.then(function(){ buildGraph(); started=true; readyRes(); });
}
setTimeout(prepare,400);     // i suoni si caricano appena apri l'app, non quando entri
document.addEventListener('visibilitychange',function(){ if(!ctx||!started) return; if(document.hidden) ctx.suspend(); else if(wantPlay&&current&&vLab.classList.contains('on')) ctx.resume(); });

var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(!vLab.classList.contains('on')||!W){last=now; return;}
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(started&&playing&&current){
    var p=pos(), idx=Math.floor(p/ENV_DT);
    S.forEach(function(s){
      s.gv+=(Math.max(0,s.want)-s.gv)*(1-Math.exp(-dt/0.25));
      var raw=s.env?Math.min(1,(s.env[Math.min(idx,s.env.length-1)]||0)/(s.ref*2.6)):0;
      s.level+=(raw-s.level)*(raw>s.level?0.35:0.08);
    });
    M.update(dt);
    progEl.style.transform='scaleX('+(p/TOT)+')';
  }
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
  if(current) M.draw(now/1000);
}
route();
requestAnimationFrame(frame);
})();
</script>
