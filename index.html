<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Racconti">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Racconti di ispirazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Unbounded";src:url(fonts/unbounded.woff2) format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
/* Nero pieno, un solo carattere (San Francisco sui dispositivi Apple), fotografie grandi,
   niente bordi. Lo schermo non si muove mai: scorre solo il contenuto della home. */
:root{
  color-scheme:dark;
  --bg:#000;
  --surface:#1c1c1e;
  --label:#f5f5f7;
  --secondary:#98989f;
  --separator:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;width:100%}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{display:block;-webkit-user-drag:none;pointer-events:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
body{height:100%;width:100%}
.app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:500px;margin:0 auto;overflow:hidden;background:var(--bg)}
#probe{position:absolute;visibility:hidden;pointer-events:none;top:0;left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view{position:absolute;inset:0;visibility:hidden;-webkit-clip-path:circle(0px at var(--cx,50%) var(--cy,50%));clip-path:circle(0px at var(--cx,50%) var(--cy,50%));transition:clip-path .75s cubic-bezier(.6,0,.3,1),-webkit-clip-path .75s cubic-bezier(.6,0,.3,1),visibility 0s .75s}
.view.on{visibility:visible;-webkit-clip-path:circle(150vmax at var(--cx,50%) var(--cy,50%));clip-path:circle(150vmax at var(--cx,50%) var(--cy,50%));transition:clip-path 1.05s cubic-bezier(.5,0,.2,1),-webkit-clip-path 1.05s cubic-bezier(.5,0,.2,1)}

.view.instant,.view.instant.on{transition:none!important}
.fly{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,0);transition:background 1.1s ease;pointer-events:none}
.fly.go{background:#000}
.fly.out{opacity:0;transition:opacity .5s ease}
.flyc{position:absolute;display:block;font-family:"Unbounded",var(--font);font-weight:300;text-transform:uppercase;line-height:.72;color:#f5f5f7;transform-origin:50% 50%;transition:transform 1.35s cubic-bezier(.65,0,.2,1),opacity 1.35s ease;will-change:transform}
#home{clip-path:none!important;-webkit-clip-path:none!important;visibility:visible!important}
@media (prefers-reduced-motion:reduce){.view,.view.on{transition:none}}
.press{transition:transform .25s var(--ease)}
.press:active{transform:scale(.97)}

/* ---------- Home: porte che scorrono di lato e si coprono. Una porta è una foto, la successiva è solo una parola.
   Tipografia: una sola famiglia larga. Le parole grandi tutte maiuscole e sottili; tutto il resto minuscolo, piccolo, spaziato. ---------- */
#home{overflow:hidden}
.doors{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x}
.doors::-webkit-scrollbar{display:none;width:0;height:0}
.door{position:sticky;left:0;flex:0 0 100%;min-width:0;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000;color:var(--label);box-shadow:-50px 0 90px rgba(0,0,0,.6)}
.door .bg{position:absolute;top:0;bottom:0;left:-10%;width:120%;height:100%;object-fit:cover;will-change:transform}
.door.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 58%,rgba(0,0,0,.82) 100%)}
.door .in{position:absolute;z-index:1;left:26px;right:26px;bottom:calc(40px + var(--sb));display:flex;flex-direction:column;align-items:flex-start;gap:14px;will-change:transform,opacity}
.tiny{font-family:"Unbounded",var(--font);font-weight:300;font-size:11px;letter-spacing:.14em;text-transform:lowercase;color:rgba(255,255,255,.62)}
.word{font-family:"Unbounded",var(--font);font-weight:300;font-size:44px;line-height:1.04;letter-spacing:.01em;text-transform:uppercase;margin:0;white-space:nowrap}
.door{isolation:isolate}
.door.type .bg{opacity:.13}
.amb{position:absolute;inset:-25%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(36% 28% at 30% 36%,rgba(255,200,130,.17),transparent 72%),radial-gradient(32% 26% at 72% 66%,rgba(150,175,255,.08),transparent 72%);animation:amb 44s ease-in-out infinite alternate;will-change:transform}
.door.photo .amb{opacity:.6}
@keyframes amb{0%{transform:translate3d(-7%,-4%,0) rotate(0deg)}50%{transform:translate3d(6%,4%,0) rotate(9deg)}100%{transform:translate3d(-3%,7%,0) rotate(-7deg)}}
/* laboratorio: la parola riempie la pagina, due lettere per riga. Le lettere sono finestre: dentro si vedono due fotografie che si scambiano piano */
.knock .under{position:absolute;inset:0;background:#000;overflow:hidden}
.knock .under .bg{top:-6%;height:112%}
.knock .under .b1{opacity:.2;animation:dx1 34s ease-in-out infinite alternate}
.knock .under .b2{opacity:0;animation:dx2 34s ease-in-out infinite alternate}
@keyframes dx1{from{opacity:.24}to{opacity:.05}}
@keyframes dx2{from{opacity:0}to{opacity:.22}}
.knock .in{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);gap:20px}
.word.big{width:64vw;height:64vw;display:flex;flex-direction:column;justify-content:space-between;font-size:13vw;line-height:.72;letter-spacing:0}
.word.big .r{display:flex;justify-content:space-between}
.word.big i{font-style:normal;display:block}
@media (min-width:500px){.word.big{width:320px;height:320px;font-size:65px}}
@media (prefers-reduced-motion:reduce){.amb,.knock .under .bg{animation:none}}
.knock .enter{top:calc(12px + var(--st));bottom:auto;right:14px;border:0;color:rgba(255,255,255,.62)}
.knock .n{position:absolute;z-index:1;top:calc(24px + var(--st));left:26px}
@media (prefers-reduced-motion:reduce){.amb,.knock .under .b2{animation:none}}
.di{font-size:.27em;letter-spacing:.16em;text-transform:lowercase;color:rgba(255,255,255,.62);margin-left:.5em}
.ch{display:inline-block}
.vword{position:absolute;z-index:1;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) rotate(-90deg);font-family:"Unbounded",var(--font);font-weight:300;font-size:96px;line-height:1;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;will-change:transform}
.type .n{position:absolute;z-index:1;top:calc(24px + var(--st));left:26px}
.type .s{position:absolute;z-index:1;bottom:calc(34px + var(--sb));left:26px}
.enter{position:absolute;z-index:1;right:24px;bottom:calc(26px + var(--sb));width:48px;height:48px;border:1px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center}
.enter svg{width:16px;height:16px}
.end .in{bottom:auto;top:50%;transform:translateY(-50%);gap:18px}
.end .word{font-size:20px;color:var(--secondary)}
.upd{margin-top:14px;height:40px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--label);font-family:"Unbounded",var(--font);font-weight:300;font-size:11px;letter-spacing:.1em;text-transform:lowercase}
.upd.new{background:#fff;color:#000}

/* ---------- Sezioni: ogni porta ha il suo disegno a filo; la pagina lo riprende in testa ---------- */
.art{position:absolute;left:50%;top:38%;width:62vw;max-width:310px;transform:translate(-50%,-50%);color:rgba(255,255,255,.6);pointer-events:none}
.art svg,.sart svg{display:block;width:100%;height:auto;overflow:visible}
.art svg *,.sart svg *{vector-effect:non-scaling-stroke}
/* ogni copertina è diversa: due sono fotografie piene, due sono solo un disegno con il nome piccolo dentro, le altre cambiano peso e posto */
.d-musiche .art,.d-taccuino .art{display:none}
.d-taccuino .bg{display:none}
.sheets img{position:absolute;width:46%;height:auto;box-shadow:0 12px 30px rgba(0,0,0,.6);border-radius:2px}
.d-taccuino .in{bottom:auto;top:calc(64px + var(--st))}
.d-respiro .bg,.d-letture .bg{display:none}
.d-respiro .art{width:84vw;max-width:420px;top:47%}
.d-respiro .in,.d-insieme .in{left:0;right:0;top:47%;bottom:auto;transform:translateY(-50%);align-items:center;gap:10px}
.word.sm{font-size:12px!important;letter-spacing:.34em;margin-right:-.34em}
.d-respiro .tiny,.d-insieme .tiny{display:none}
.d-insieme .art{width:92vw;max-width:460px;top:47%}
.d-letture .art{width:108vw;max-width:540px;top:50%;color:rgba(255,255,255,.22)}
.d-letture .in{top:50%;bottom:auto;transform:translateY(-50%);left:0;right:0;align-items:center}
.d-giardini .art{width:88vw;max-width:440px;top:36%}
.d-partiture .art{width:100%;max-width:none;top:42%}
.d-partiture .in{align-items:flex-end}
.d-voci .art{width:78vw;top:60%}
.d-anni .art{width:96vw;max-width:480px;top:44%}
.d-voci .in{bottom:auto;top:calc(64px + var(--st))}
.breath{transform-origin:100px 100px;animation:breath 11s ease-in-out infinite alternate}
@keyframes breath{from{transform:scale(.8)}to{transform:scale(1.08)}}
.inv{margin-top:6px;padding:6px 0;pointer-events:auto}
#sez{background:#000;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y;z-index:5}
#sez::-webkit-scrollbar{display:none;width:0}
#sez .sback{position:fixed;z-index:2;top:calc(12px + var(--st));left:14px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:rgba(255,255,255,.62)}
.sz{padding:calc(70px + var(--st)) 26px calc(70px + var(--sb));display:flex;flex-direction:column;align-items:flex-start;-webkit-user-select:text;user-select:text}
.sart{width:46vw;max-width:230px;color:rgba(255,255,255,.55);margin:0 0 34px}
.sz .word{white-space:normal;font-size:30px;line-height:1.1;margin:12px 0 26px;text-wrap:balance}
.lead{margin:0 0 16px;font-size:20px;line-height:1.4;color:var(--label);max-width:30ch;text-wrap:pretty}
.par{margin:0 0 16px;font-size:16px;line-height:1.55;color:var(--secondary);max-width:38ch;text-wrap:pretty}
.rowi{width:100%;display:flex;flex-direction:column;gap:8px;padding:20px 0;border-top:1px solid var(--separator);margin-top:8px}
.rowi+.rowi{margin-top:0}
.rowi b{font-family:"Unbounded",var(--font);font-weight:300;font-size:15px;line-height:1.3;letter-spacing:.02em;text-transform:uppercase}
.rowi .soon{color:rgba(255,255,255,.38)}
.gar{display:flex;gap:10px;align-items:center;width:100%;margin:16px 0 4px}
.gar .upd{margin:0;flex:none;background:#fff;color:#000}
#gform{flex:1;min-width:0}
#gq{width:100%;height:40px;border:0;border-bottom:1px solid var(--separator);border-radius:0;background:none;color:var(--label);font-family:"Unbounded",var(--font);font-weight:300;font-size:16px;letter-spacing:.02em;text-transform:lowercase;outline:none;padding:0 2px}
#gq::placeholder{color:rgba(255,255,255,.38);font-size:11px;letter-spacing:.1em}
#gmsg{min-height:16px;margin:14px 0 4px}
#glist{width:100%}
.gcred{margin-top:26px;color:rgba(255,255,255,.3)}
.emb{width:100%;border:0;border-radius:12px;background:#111;display:block}
.emb.sp{height:352px}
.yt{position:relative;width:100%;aspect-ratio:16/9}
.yt .emb{position:absolute;inset:0;height:100%}
.lnk{padding:10px 0 0}
.bbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;margin:0 0 40px}
.bstage{position:relative;width:74vw;max-width:340px;aspect-ratio:1;display:grid;place-items:center}
.bring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.75);box-shadow:0 0 0 22px rgba(255,255,255,.035),0 0 0 44px rgba(255,255,255,.02);transform:scale(.5);opacity:.5;will-change:transform}
.bbox .upd{margin:0}
.bbox.run .upd{background:none;color:rgba(255,255,255,.5)}
.bbox.run .bnote{visibility:hidden}
.bbox{touch-action:none;-webkit-user-select:none;user-select:none}
.bnote{text-align:center;max-width:30ch;line-height:1.5}
#bquo{min-height:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#bquo .lead{margin:0;max-width:24ch;text-align:center}
#sez.breathing{overflow:hidden}
#sez.breathing .sback{opacity:0;pointer-events:none}
#sez.breathing .bbox{position:fixed;inset:0;z-index:6;margin:0;justify-content:center;gap:34px;background:radial-gradient(90% 60% at 50% 45%,#0b1b3a 0%,#050b1c 55%,#01030a 100%);animation:qin 1.6s ease both}
#sez.breathing .bring{border-color:rgba(150,190,255,.85);box-shadow:0 0 0 26px rgba(90,140,255,.07),0 0 0 54px rgba(90,140,255,.04),0 0 90px rgba(70,120,255,.25)}
#sez.breathing #blab{color:rgba(190,215,255,.8)}
.bbox.done .bstage{display:none}
.bbox.done #bquo{padding:70px 0 30px;animation:qin 2.5s ease both}
@keyframes qin{from{opacity:0}to{opacity:1}}
.yrw{position:sticky;top:0;height:0;width:100%;z-index:0;pointer-events:none}
.yr{position:absolute;top:24vh;left:-10px;font-family:"Unbounded",var(--font);font-weight:300;font-size:40vw;line-height:1;letter-spacing:-.02em;color:rgba(255,255,255,.09);white-space:nowrap}
@media (min-width:500px){.yr{font-size:200px}}
.rcs{width:100%;display:flex;flex-direction:column;padding:40px 0 30vh;position:relative}
.rc{position:relative;display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.rc.r{align-self:flex-end;text-align:right;align-items:flex-end}
.rp{width:100%;aspect-ratio:2/3;background:#0e0e0e center/cover no-repeat;box-shadow:0 20px 50px rgba(0,0,0,.7);display:flex;align-items:flex-end;padding:14px;will-change:transform;margin-bottom:6px;outline:1px solid rgba(255,255,255,.08);outline-offset:-1px}
.rp b{font-family:"Unbounded",var(--font);font-weight:300;font-size:22px;line-height:1.08;text-transform:uppercase;text-align:left;text-wrap:balance}
.rp.has b{display:none}
.rt{font-family:"Unbounded",var(--font);font-weight:300;font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.rn{color:rgba(255,220,170,.8)}
.mapv{width:100%;margin:10px 0 0;overflow:hidden;color:rgba(255,255,255,.75);touch-action:pan-y}
#mp{display:block;width:100%;height:auto;transition:transform .9s cubic-bezier(.5,0,.15,1)}
.pin{cursor:pointer}
.pin.on circle:nth-child(2){stroke:#fff;fill:rgba(255,255,255,.25)}
.full{overflow:hidden!important}
#sez.full .sback{background:rgba(0,0,0,.55);color:#fff}
.full .sz{padding:0;display:block;position:absolute;inset:0;-webkit-user-select:none;user-select:none}
.deskv{position:absolute;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(120% 90% at 50% 40%,#1b1712 0%,#0b0a08 60%,#000 100%)}
.desk{position:absolute;left:0;top:0;width:1640px;height:2100px;transform-origin:0 0;will-change:transform}
.desk img{position:absolute;height:auto;box-shadow:0 14px 36px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5);border-radius:2px;pointer-events:none;-webkit-user-drag:none}
.deskh{position:absolute;left:26px;right:26px;top:calc(70px + var(--st));pointer-events:none;transition:opacity .8s;text-shadow:0 2px 18px #000}
.deskh .word{margin:10px 0 0}
.deskh.away{opacity:0}
.tac{display:flex;gap:14px;width:calc(100% + 52px);margin:22px -26px 14px;padding:0 26px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.tac::-webkit-scrollbar{display:none}
.tpage{flex:0 0 86%;scroll-snap-align:center;height:62vh;max-height:560px;background:#0d0d0d;border-radius:3px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6);transform:rotate(-.6deg)}
.tpage:nth-child(even){transform:rotate(.5deg)}
.tpage img{width:100%;height:100%;object-fit:cover;pointer-events:none}
#zoom{position:fixed;inset:0;z-index:9;background:#000;overflow:hidden;touch-action:none;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
#zoom.on{opacity:1;visibility:visible;transition:opacity .35s}
#zimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:0 0;will-change:transform;-webkit-user-drag:none}
#zclose{position:absolute;top:calc(12px + var(--st));right:14px;background:rgba(0,0,0,.5)}
#zclose svg{pointer-events:none}
@media (prefers-reduced-motion:reduce){.breath{animation:none}}

/* ---------- Laboratorio ---------- */
#lab{background:#000;touch-action:none;z-index:5}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bartop{position:absolute;top:0;left:0;right:0;padding:calc(12px + var(--st)) 14px 0;display:grid;grid-template-columns:44px 44px 1fr 44px 44px;align-items:center;gap:8px;pointer-events:none}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.round svg{width:18px;height:18px}
.piece{text-align:center;line-height:1.2}
.piece b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.piece span{font-size:13px;color:var(--secondary)}
.barbot{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(30px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
#status{min-height:24px;font-size:17px;font-weight:500;letter-spacing:-.01em;color:var(--label);text-align:center;opacity:0;transition:opacity .5s}
#reset{pointer-events:auto;width:100%;height:52px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:17px;font-weight:600;transition:opacity .3s,transform .25s var(--ease)}
#reset[disabled]{opacity:.32}
#intro.off{display:none}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:26px;padding:0 24px calc(28px + var(--sb));
  background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.9) 55%,#000 100%);transition:opacity .7s var(--ease),visibility 0s .7s}
#intro.off{opacity:0;visibility:hidden;pointer-events:none}
#intro h2{font-size:40px;line-height:1.03;letter-spacing:-.03em;margin:0;text-wrap:balance}
#intro ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:19px;line-height:1.25;color:var(--secondary);font-weight:500;letter-spacing:-.01em}
#intro li b{color:var(--label);font-weight:600}
#go{height:56px;border-radius:999px;background:#fff;color:#000;font-size:18px;font-weight:600;width:100%}
#go[disabled]{opacity:.6}
#intro small{font-size:13px;color:var(--secondary);text-align:center;margin-top:-10px}

.prog{position:absolute;left:16px;right:16px;top:calc(66px + var(--st));height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;background:rgba(255,255,255,.6);transform-origin:left;transform:scaleX(0)}
#lab.inmenu .piece{display:none}
#lab.inmenu .bartop .round{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:rgba(255,255,255,.55)}
#menu{position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:0;padding:calc(54px + var(--st)) 6px calc(14px + var(--sb));background:#000;transition:opacity .5s var(--ease),visibility 0s .5s}
#menu.off{opacity:0;visibility:hidden;pointer-events:none}
.glyph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--label);padding:0}
.glyph svg{width:54px;height:54px}
.glyph span{font-family:"Unbounded",var(--font);font-weight:300;font-size:9px;letter-spacing:.14em;text-transform:lowercase;color:var(--secondary)}
.bartop{z-index:4;transition:opacity .5s}
.ctl{transition:opacity .5s}
#lab.inmenu .ctl{opacity:0;pointer-events:none}
#lab:not(.inmenu):not(.ctlon) .bartop,#lab:not(.inmenu):not(.ctlon) .prog,#lab:not(.ctlon) .barbot{opacity:0;pointer-events:none}
#lab:not(.inmenu):not(.ctlon) .bartop *,#lab:not(.ctlon) .barbot *{pointer-events:none}
.barbot{transition:opacity .5s}
#zone{position:absolute;z-index:3;top:0;left:0;right:0;height:calc(64px + var(--st))}
#lab.inmenu #zone{display:none}
#zone::after{content:"";position:absolute;left:50%;bottom:26px;width:26px;height:2px;margin-left:-13px;border-radius:2px;background:rgba(255,255,255,.22);transition:opacity .5s}
#lab.ctlon #zone::after{opacity:0}
.piece b{font-family:"Unbounded",var(--font);font-weight:300;font-size:12px;letter-spacing:.1em;text-transform:lowercase}
.piece span{display:none}
.walk{font-family:"Unbounded",var(--font);font-weight:300;font-size:11px;letter-spacing:.1em;text-transform:lowercase}
.modes{position:absolute;left:0;right:0;top:calc(78px + var(--st));display:flex;gap:6px;padding:0 14px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;height:38px;padding:0 15px;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--secondary);transition:background .25s,color .25s}
.modes button.on{background:var(--glass);color:var(--label)}
#hint{margin:0;font-family:"Unbounded",var(--font);font-weight:300;font-size:15px;line-height:1.45;letter-spacing:.01em;text-transform:lowercase;color:var(--label);text-align:center;max-width:26ch;min-height:44px;text-wrap:balance;opacity:0;transition:opacity 1.6s}
#hint.show{opacity:.92}
.dots{display:flex;gap:7px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);transition:background .4s}
.dots i.on{background:#fff}
.walk{pointer-events:auto;height:40px;padding:0 18px;border-radius:999px;background:var(--glass);font-size:15px;font-weight:600;color:var(--label)}
.walk.on{background:#fff;color:#000}
.walkrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.introp{margin:0;font-size:19px;line-height:1.3;color:var(--secondary);font-weight:500;letter-spacing:-.01em;max-width:30ch}
@media (prefers-reduced-motion:reduce){.view,.press,#intro,#status,#reset{transition:none}}
</style>

<script>
(function(){
"use strict";
/* ---- Lo schermo non si muove: niente zoom, niente rimbalzi ---- */
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});
document.addEventListener('touchmove',function(e){if(e.touches.length>1) e.preventDefault();},{passive:false});
document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---- Versione e aggiornamento: l'app salvata sulla Home tiene in memoria la pagina vecchia ---- */
var BUILD='34', updBtn=document.getElementById('upd');
document.getElementById('ver').textContent=BUILD;
function fresh(){ location.replace(location.pathname+'?v='+Date.now()+location.hash); }
function checkVersion(){
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(j&&j.build&&j.build!==BUILD){ updBtn.classList.add('new'); updBtn.textContent='c’è la versione '+j.build+' · aggiorna';
      var tried=null; try{ tried=sessionStorage.getItem('racconti-agg'); }catch(e){}
      if(BUILD!=='test'&&tried!==String(j.build)&&document.getElementById('home').classList.contains('on')){ try{ sessionStorage.setItem('racconti-agg',String(j.build)); }catch(e){} fresh(); }   // se sei sulla home, carica subito la nuova
    }
  }).catch(function(){});
}
updBtn.addEventListener('click',function(){
  updBtn.textContent='controllo…';
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(j&&j.build&&j.build!==BUILD) fresh(); else updBtn.textContent='versione '+BUILD+' · è l’ultima';
  }).catch(function(){ fresh(); });
});
checkVersion();
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkVersion(); });

var vHome=document.getElementById('home'), vLab=document.getElementById('lab');
/* ---- Le parole grandi si adattano allo schermo: quelle in orizzontale alla larghezza, quelle in verticale all'altezza ---- */
function splitLetters(node){
  [].slice.call(node.childNodes).forEach(function(n){
    if(n.nodeType===3){ var f=document.createDocumentFragment(); n.textContent.split('').forEach(function(c){ if(c===' '){ f.appendChild(document.createTextNode(' ')); return; } var s=document.createElement('span'); s.className='ch'; s.textContent=c; f.appendChild(s); }); node.replaceChild(f,n); }
    else if(n.nodeType===1&&n.tagName!=='BR') splitLetters(n);
  });
}
function fitOne(w,start){ var max=w.parentNode.getBoundingClientRect().width-4, fs=start, n=0; if(max<50) return start; w.style.fontSize=fs+'px'; while(Math.max(w.scrollWidth,w.getBoundingClientRect().width)>max&&fs>12&&n<80){ fs-=1; w.style.fontSize=fs+'px'; n++; } return fs; }
function fitWords(){
  var words=[].slice.call(document.querySelectorAll('.door:not(.end) .word:not(.big):not(.sm)')), min=64;
  words.forEach(function(w){ min=Math.min(min,fitOne(w,64)); });     // una sola misura per tutte le porte: quella della parola più lunga
  words.forEach(function(w){ w.style.fontSize=min+'px'; });
  [].forEach.call(document.querySelectorAll('.end .word'),function(w){ fitOne(w,20); });
}
window.addEventListener('resize',fitWords); window.addEventListener('load',fitWords);
if(document.fonts&&document.fonts.load) document.fonts.load('300 40px Unbounded').then(fitWords,function(){});
[300,1000,2500,5000].forEach(function(ms){ setTimeout(fitWords,ms); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitWords);

/* ---- Porte: quella che arriva copre quella di prima; dentro, foto e parole si muovono a velocità diverse ---- */
var doorsEl=document.getElementById('doors'), doorList=[].slice.call(doorsEl.children), doorRaf=0;
function layDoors(){
  doorRaf=0; var w=doorsEl.clientWidth||1, sl=doorsEl.scrollLeft;
  doorList.forEach(function(d,i){
    var off=(i*w-sl)/w; if(off<-1.2||off>1.2) return;
    var bg=d.querySelector('.bg'), inn=d.querySelector('.in'), vw=d.querySelector('.vword');
    if(bg) bg.style.transform='translate3d('+(-off*9)+'%,0,0) scale('+(1+0.06*Math.abs(off))+')';
    d.classList.toggle('live',Math.abs(off)<0.45);
    if(d.id==='tolab'){ var o=Math.max(0,Math.min(1,Math.abs(off))), e=o*o; [].forEach.call(d.querySelectorAll('.word.big i'),function(el,k){ var a=k*2.4+1; el.style.transform='translate3d('+(Math.cos(a)*e*190+off*60*(k%3))+'px,'+(Math.sin(a)*e*260)+'px,0) scale('+(1-0.5*e)+') rotate('+(Math.sin(a*1.7)*e*40)+'deg)'; el.style.opacity=1-o*0.9; }); }
  });
}
doorsEl.addEventListener('scroll',function(){ if(!doorRaf) doorRaf=requestAnimationFrame(layDoors); },{passive:true});
window.addEventListener('resize',layDoors); layDoors();
document.addEventListener('keydown',function(e){
  if(!vHome.classList.contains('on')) return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ var w=doorsEl.clientWidth; doorsEl.scrollTo({left:(Math.round(doorsEl.scrollLeft/w)+(e.key==='ArrowRight'?1:-1))*w,behavior:'smooth'}); }
});

/* ---- Le sezioni: ognuna ha il suo disegno, usato sulla porta e in testa alla pagina. I testi sono quelli di Paolo ---- */
var ART=(function(){
  var i, s, A={};
  function wrap(b){ return '<svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">'+b+'</svg>'; }
  s=''; for(i=0;i<27;i++){ var x=9+i*7, u=i/26, h=8+78*Math.pow(Math.sin(Math.PI*u),1.5)*(0.45+0.55*Math.abs(Math.sin(u*9.2+0.6))); s+='<path d="M'+x+' '+(100-h).toFixed(1)+'V'+(100+h).toFixed(1)+'"/>'; }
  A.musiche=wrap(s);                                                       // un'onda di suono
  A.respiro=wrap('<g class="breath"><circle cx="100" cy="100" r="34"/><circle cx="100" cy="100" r="58" opacity=".6"/><circle cx="100" cy="100" r="82" opacity=".3"/></g>');   // un respiro
  s='<path d="M44 18V182" opacity=".5"/>'; for(i=0;i<8;i++) s+='<path d="M14 '+(34+i*19)+'H186" opacity=".35"/>';
  s+='<path d="M54 66c8-12 14 8 22-2s10-10 16-2 12 6 18-2 12-6 20 2"/><path d="M54 104c10-10 16 8 26 0s14-8 22 0"/>';
  A.taccuino=wrap(s);                                                      // una pagina a righe, con due righe scritte
  s='<path d="M100 22V178" opacity=".5"/>'; var L=[62,70,54,68,60,72,48,66,58,30], R=[70,58,66,72,50,68,62,56,70,40];
  for(i=0;i<10;i++){ s+='<path d="M'+(88-L[i])+' '+(34+i*14.5)+'H88" opacity=".7"/><path d="M112 '+(34+i*14.5)+'H'+(112+R[i])+'" opacity=".7"/>'; }
  A.letture=wrap(s);                                                       // due pagine aperte
  s=''; [[62,70,34],[128,56,24],[150,112,30],[84,134,26],[36,128,16],[118,160,14],[176,62,12],[104,96,10],[30,58,10]].forEach(function(c){ s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+c[2]+'"/><circle cx="'+c[0]+'" cy="'+c[1]+'" r="1.2" fill="currentColor"/>'; });
  A.giardini=wrap(s);                                                      // un giardino visto dall'alto
  A.insieme=wrap('<circle cx="76" cy="100" r="58"/><circle cx="124" cy="100" r="58"/><path d="M100 47.2a58 58 0 0 1 0 105.6a58 58 0 0 1 0-105.6z" fill="currentColor" fill-opacity=".14" stroke="none"/>');   // due persone, e ciò che nasce in mezzo
  s=''; for(i=0;i<5;i++) s+='<path d="M10 '+(72+i*14)+'H190" opacity=".55"/>'; s+='<path d="M10 72V128M190 72V128M104 72V128" opacity=".55"/>';

  function km(a,b,c,d){ var R=6371, x=(d-b)*Math.PI/180*Math.cos((a+c)*Math.PI/360), y=(c-a)*Math.PI/180; return R*Math.sqrt(x*x+y*y); }

    var q='[out:json][timeout:20];(nwr["leisure"~"^(park|garden|nature_reserve)$"]["name"](around:5000,'+lat+','+lon+'););out center 80;';
    fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q)).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
      var seen={}, it=[];
      (j.elements||[]).forEach(function(e){ var la=e.lat||(e.center&&e.center.lat), lo=e.lon||(e.center&&e.center.lon), n=e.tags&&e.tags.name; if(!n||la==null||seen[n]) return; seen[n]=1;
        it.push({n:n,la:la,lo:lo,d:km(lat,lon,la,lo),k:e.tags.leisure==='garden'?'giardino':e.tags.leisure==='nature_reserve'?'riserva':'parco'}); });
      it.sort(function(a,b){ return a.d-b.d; }); it=it.slice(0,24);

  });

  });

    .then(function(r){ if(!r.ok) throw new Error('file'); return r.arrayBuffer(); })

/* 4. tre centri: la musica sta nei legami tra le parti, e i legami vanno tenuti vivi.

/* legami: si parte dal solo arpeggio degli archi, sopra un mi lungo. Tiri un legame dal centro (o da un segno acceso) verso un posto vuoto:
   entra una voce. Quale, lo decide il brano: una di quelle che in quel momento stanno suonando, più o meno sempre nello stesso ordine,
   e il tema non entra finché sotto non c'è chi lo sostiene. Il legame è lo scambio: il suono di ognuno dei due scorre verso l'altro */
var drone=null;

  });

  var ng=ctx.createGain(); ng.gain.value=0.05; var nl=ctx.createOscillator(), nd=ctx.createGain(); nl.frequency.value=0.07; nd.gain.value=0.035; nl.connect(nd); nd.connect(ng.gain); nl.start();

    hint:'',
    enter:function(){ e=ROCK.map(function(){return 0;}); pts=[]; used=false; },
    down:rake, move:rake, up:function(){ if(pts.length) pts[pts.length-1].brk=true; },
    update:function(dt){
      var full=1; for(var k=0;k<9;k++){ e[k]=Math.max(0,e[k]-dt/32); if(e[k]<0.55) full=0; }
      padOn(full); ROCK.forEach(function(r,k){ vol(r[2],ss(0.05,0.7,e[k]),full); });
      var tn=performance.now()/1000; while(pts.length&&tn-pts[0].t>LIFE) pts.shift();
    },
    draw:function(t){
      var tn=performance.now()/1000, o, i, k;
      g.lineCap='round'; g.lineJoin='round'; g.lineWidth=1;
      for(o=-2;o<=2;o++){                                        // cinque denti
        for(i=1;i<pts.length;i++){ var a=pts[i-1], b=pts[i]; if(b.first||a.brk) continue;
          g.strokeStyle='rgba('+INK+','+0.42*Math.pow(1-(tn-b.t)/LIFE,1.5)+')'; g.beginPath(); g.moveTo(a.x+a.nx*o*7,a.y+a.ny*o*7); g.lineTo(b.x+b.nx*o*7,b.y+b.ny*o*7); g.stroke(); }
      }
      for(k=0;k<9;k++){ var x=rx(k), y=ry(k), s=BY[ROCK[k][2]], n=1+Math.floor(e[k]*4.99);
        for(i=1;i<=n;i++){ g.strokeStyle='rgba('+INK+','+(i===1?0.2+0.5*e[k]:0.45*e[k]*(1-i/7))+')'; g.beginPath(); g.arc(x,y,5+i*8+(i>1?4*s.level:0),0,TAU); g.stroke(); }
        g.fillStyle='rgba('+INK+','+(0.35+0.65*e[k])+')'; g.beginPath(); g.arc(x,y,4,0,TAU); g.fill(); }
      if(!used){ var ph=(t*0.3)%1, an=ph*TAU; ghost(rx(0)+34*Math.cos(an),ry(0)+34*Math.sin(an),Math.min(1,ph*1.2)); }
    }
  };
})();

/* ensō: un solo gesto. Quanto chiudi il cerchio, tanto si apre il brano; poi l'inchiostro asciuga, e si ricomincia */
MODES.enso=(function(){
  var pts=[], acc=0, ink=0, drawing=null, v=0, used=false;
  function ax(q){ return Math.atan2(q.y-(TOP+BOT)/2,q.x-W/2); }
  return {
    hint:'',
    enter:function(){ pts=[]; acc=0; ink=0; drawing=null; v=0; used=false; },
    down:function(q){ if(drawing) return; drawing=q; pts=[{x:q.x,y:q.y,w:5}]; acc=0; ink=1; q.a=ax(q); used=true; },
    move:function(q){ if(q!==drawing) return; var l=pts[pts.length-1], d=Math.hypot(q.x-l.x,q.y-l.y); if(d<4) return;
      var a=ax(q), da=a-q.a; if(da>Math.PI) da-=TAU; if(da<-Math.PI) da+=TAU; acc+=da; q.a=a;
      var w=Math.max(4,Math.min(24,26-d*0.9)); pts.push({x:q.x,y:q.y,w:l.w+(w-l.w)*0.25}); },
    up:function(q){ if(q===drawing) drawing=null; },
    update:function(dt){
      if(!drawing) ink=Math.max(0,ink-dt/48);
      var tv=Math.min(1,Math.abs(acc)/(TAU*0.97))*Math.min(1,ink*1.6); v+=(tv-v)*(1-Math.exp(-dt/0.6));
      applyLadder(Math.floor(v*9.3+0.001),true);
    },
    draw:function(t){
      g.lineCap='round';
      g.strokeStyle='rgba('+INK+','+(used?0.05:0.1+0.06*Math.sin(t*1.6))+')'; g.lineWidth=1; g.beginPath(); g.arc(W/2,(TOP+BOT)/2,Math.min(W*0.34,(BOT-TOP)*0.3),0,TAU); g.stroke();
      var al=0.92*Math.min(1,ink*1.6);
      for(var i=1;i<pts.length;i++){ g.strokeStyle='rgba('+INK+','+al+')'; g.lineWidth=pts[i].w; g.beginPath(); g.moveTo(pts[i-1].x,pts[i-1].y); g.lineTo(pts[i].x,pts[i].y); g.stroke(); }
      if(!used){ var ph=(t*0.2)%1, R=Math.min(W*0.34,(BOT-TOP)*0.3), an=-2.2+ph*TAU; ghost(W/2+R*Math.cos(an),(TOP+BOT)/2+R*Math.sin(an),Math.min(1,ph*1.1)); }
    }
  };
})();


var walkBtn=document.getElementById('walk'), calBtn=document.getElementById('cal'), walking=false, h0=null, head=0, lastStep=0, grav=9.8, gotMotion=false, wake=null;
var CAL=null, calib=null, calData=null; try{ CAL=JSON.parse(localStorage.getItem('racconti-passo')||'null'); }catch(e){}
function onMotion(e){
  var a=e.accelerationIncludingGravity; if(!a||a.x==null) return; gotMotion=true;
  var m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z); grav+=(m-grav)*0.05;
  var now=performance.now(), hp=m-grav, thr=CAL&&CAL.thr||1.3;
  if(calib) calib.samples.push([Math.round(now-calib.t0),Math.round(hp*100)/100]);
  if(hp>thr&&now-lastStep>320){
    lastStep=now;
    if(calib){ calib.n++; calBtn.textContent='arrivo · '+calib.n+' passi'; }
    if(current&&M.step) M.step(CAL&&typeof CAL.head==='number'?head-CAL.head:(h0===null?0:head-h0), CAL&&CAL.steps?0.9/CAL.steps:0);
  }
}
/* taratura: partenza, cammini fino in fondo alla stanza, arrivo. Da lì il passo e la direzione sono i tuoi */
function median(a){ var s=a.slice().sort(function(x,y){return x-y;}); return s.length?s[Math.floor(s.length/2)]:0; }
function countSteps(sm,th){ var n=0,last=-1e9; sm.forEach(function(p){ if(p[1]>th&&p[0]-last>320){ n++; last=p[0]; } }); return n; }
calBtn.addEventListener('click',function(){
  if(calData){ var txt=JSON.stringify(calData); calData=null; calBtn.textContent='tara di nuovo';
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ calBtn.textContent='dati copiati · tara di nuovo'; }).catch(function(){});
    return; }
  if(!calib){ calib={n:0,samples:[],heads:[],t0:performance.now()}; calBtn.classList.add('on'); calBtn.textContent='arrivo · 0 passi'; return; }
  var c=calib; calib=null; calBtn.classList.remove('on');
  var peaks=[], run=0; c.samples.forEach(function(p){ if(p[1]>0.4) run=Math.max(run,p[1]); else if(p[1]<0.2&&run){ peaks.push(run); run=0; } });
  var thr=Math.max(0.7,Math.min(2.5,0.5*median(peaks))), n=countSteps(c.samples,thr);
  if(n<3){ calBtn.textContent='troppo pochi passi, riprova'; return; }
  var sx=0, sy=0; c.heads.forEach(function(h){ sx+=Math.sin(h); sy+=Math.cos(h); });
  CAL={steps:n,thr:Math.round(thr*100)/100}; if(c.heads.length) CAL.head=Math.atan2(sx,sy);
  try{ localStorage.setItem('racconti-passo',JSON.stringify(CAL)); }catch(e){}
  calData={passi:n,soglia:CAL.thr,direzione_gradi:typeof CAL.head==='number'?Math.round(CAL.head*180/Math.PI):null,durata_s:Math.round((performance.now()-c.t0)/100)/10,picchi:{numero:peaks.length,mediana:Math.round(median(peaks)*100)/100,min:peaks.length?Math.min.apply(null,peaks):0,max:peaks.length?Math.max.apply(null,peaks):0},campioni:c.samples.length,serie:c.samples.filter(function(_,i){return i%3===0;})};
  calBtn.textContent=n+' passi · copia dati';
});
function onOrient(e){
  var h=typeof e.webkitCompassHeading==='number'?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);
  if(h==null) return; head=h*Math.PI/180; if(h0===null) h0=head; if(calib) calib.heads.push(head);
}
function stopWalk(){
  if(!walking) return; walking=false; window.removeEventListener('devicemotion',onMotion); window.removeEventListener('deviceorientation',onOrient);
  walkBtn.classList.remove('on'); walkBtn.textContent='cammina'; calBtn.hidden=true; calib=null; calBtn.classList.remove('on'); if(wake){ try{wake.release();}catch(e){} wake=null; }
}
walkBtn.addEventListener('click',function(){
  if(walking){ stopWalk(); return; }
  if(!window.DeviceMotionEvent){ walkBtn.textContent='questo dispositivo non ha sensori'; return; }
  var ask=typeof DeviceMotionEvent.requestPermission==='function'?DeviceMotionEvent.requestPermission():Promise.resolve('granted');
  ask.then(function(r){
    if(r!=='granted') throw new Error('no');
    return (window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')?DeviceOrientationEvent.requestPermission():'granted';
  }).then(function(){
    h0=null; gotMotion=false; walking=true; window.addEventListener('devicemotion',onMotion); window.addEventListener('deviceorientation',onOrient);
    walkBtn.classList.add('on'); walkBtn.textContent='cammina: attivo'; calBtn.hidden=false; calData=null; calBtn.textContent=CAL?'tarato su '+CAL.steps+' passi · rifai':'tara';
    if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});
    setTimeout(function(){ if(walking&&!gotMotion){ stopWalk(); walkBtn.textContent='qui i sensori sono bloccati'; } },2500);
  }).catch(function(){ walkBtn.textContent='sensori non concessi'; });
});
var M=MODES.stanza, FONT=getComputedStyle(document.body).fontFamily;
var hintTimer=null, current=null, ctlTimer=null;
function showCtl(){ vLab.classList.add('ctlon'); clearTimeout(ctlTimer); ctlTimer=setTimeout(function(){ if(!walking||true) vLab.classList.remove('ctlon'); },4500); }
document.getElementById('zone').addEventListener('pointerdown',function(e){ e.preventDefault(); showCtl(); });
document.querySelector('.bartop').addEventListener('pointerdown',function(){ if(current) showCtl(); });
document.querySelector('.barbot').addEventListener('pointerdown',function(){ if(current) showCtl(); });
function showMenu(){
  current=null; vLab.classList.add('inmenu'); menuEl.classList.remove('off'); hintEl.classList.remove('show'); walkBtn.hidden=true; stopWalk();
  if(started){ playing=false; master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0,ctx.currentTime,0.25); setTimeout(function(){ if(!current&&ctx) ctx.suspend(); },900); }
}
/* ogni modo riparte da capo: la stanza dall'intro, gli altri dal tema, sopra gli archi lunghi */
function enterMode(name){
  startAudio();
  current=name; M=MODES[name]; M.enter();
  vLab.classList.remove('inmenu'); vLab.classList.remove('ctlon'); menuEl.classList.add('off');
  hintEl.textContent='';
  walkBtn.hidden=!M.walk; resize();
  whenReady.then(function(){ if(current===name){ S.forEach(function(s){ if(s.g) setPan(s,0); }); if(M.waits) idlePiece(); else startPiece(M.fromIntro?0:INTRO); } });
}
menuEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) enterMode(b.getAttribute('data-m')); });
document.getElementById('back').addEventListener('click',function(){ location.hash='#home'; });
var tolab=document.getElementById('tolab'), going=false, calmUI=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
tolab.addEventListener('click',function(e){
  startAudio(); if(ctx&&ctx.state!=='running') ctx.resume();
  if(calmUI) return; e.preventDefault(); if(going) return; going=true;
  var app=document.querySelector('.app'), ar=app.getBoundingClientRect(), fly=document.createElement('div'), PLn=MODES.legami.PL, MAP=[2,9,1,3,5,0,-1,4,7,6,8];
  fly.className='fly'; app.appendChild(fly); resize();
  [].forEach.call(tolab.querySelectorAll('.word.big i'),function(el,k){
    var r=el.getBoundingClientRect(), c=document.createElement('span'), n=MAP[k], tx=n<0?W/2:PLn[n][0]*W, ty=n<0?(TOP+BOT)/2:TOP+PLn[n][1]*(BOT-TOP);
    c.textContent=el.textContent; c.className='flyc'; c.style.left=(r.left-ar.left)+'px'; c.style.top=(r.top-ar.top)+'px'; c.style.width=r.width+'px'; c.style.height=r.height+'px'; c.style.fontSize=getComputedStyle(el).fontSize; fly.appendChild(c);
    var dx=tx-(r.left-ar.left+r.width/2), dy=ty-(r.top-ar.top+r.height/2);
    setTimeout(function(){ c.style.transform='translate('+dx+'px,'+dy+'px) scale(.09)'; c.style.opacity=n<0?0:0.55; },60+k*55);
  });
  setTimeout(function(){ fly.classList.add('go'); },30);
  setTimeout(function(){ vLab.classList.add('instant'); location.hash='#laboratorio'; setTimeout(function(){ fly.classList.add('out'); vLab.classList.remove('instant'); setTimeout(function(){ if(fly.parentNode) fly.parentNode.removeChild(fly); going=false; },520); },140); },2050);
});
var progEl=document.getElementById('prog');
document.getElementById('again').addEventListener('click',function(){ if(!started||!current) return; for(var k in P) delete P[k]; M.enter(); pauseBtn.setAttribute('aria-label','Pausa'); pauseIcon.setAttribute('d','M4.5 3h3v12h-3zM10.5 3h3v12h-3z'); if(M.waits) idlePiece(); else startPiece(M.fromIntro?0:INTRO); });
pauseBtn.addEventListener('click',function(){
  if(!started||!current) return;
  wantPlay=!wantPlay;
  if(wantPlay){ctx.resume(); pauseBtn.setAttribute('aria-label','Pausa'); pauseIcon.setAttribute('d','M4.5 3h3v12h-3zM10.5 3h3v12h-3z');}
  else{ctx.suspend(); pauseBtn.setAttribute('aria-label','Riprendi'); pauseIcon.setAttribute('d','M5.5 3l9 6-9 6z');}
});
var readyRes, whenReady=new Promise(function(r){ readyRes=r; });
var audioInit=false;
function startAudio(){
  if(audioInit) return; audioInit=true;          // il contesto può esistere già (lo apre anche Respiro): il laboratorio va preparato comunque
  var AC=window.AudioContext||window.webkitAudioContext;
  try{ if(!ctx) ctx=new AC(); ctx.resume(); }catch(e){ hintEl.textContent='questo browser non suona'; hintEl.classList.add('show'); return; }
  prepare().catch(function(){});
  firstReady.then(function(){ buildGraph(); started=true; readyRes(); });
}
setTimeout(prepare,400);     // i suoni si caricano appena apri l'app, non quando entri
document.addEventListener('visibilitychange',function(){ if(!ctx||!started) return; if(document.hidden) ctx.suspend(); else if(wantPlay&&current&&vLab.classList.contains('on')) ctx.resume(); });

var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(!vLab.classList.contains('on')||!W){last=now; return;}
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(started&&current&&(playing||M.waits)){
    var p=pos(), idx=Math.floor(p/ENV_DT);
    S.forEach(function(s){
      s.gv+=(Math.max(0,s.want)-s.gv)*(1-Math.exp(-dt/0.25));
      var raw=s.env?Math.min(1,(s.env[Math.min(idx,s.env.length-1)]||0)/(s.ref*2.6)):0;
      s.level+=(raw-s.level)*(raw>s.level?0.35:0.08);
    });
    M.update(dt);
    progEl.style.transform='scaleX('+(p/TOT)+')';
  }
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
  if(current) M.draw(now/1000);
}
route();
requestAnimationFrame(frame);
})();
